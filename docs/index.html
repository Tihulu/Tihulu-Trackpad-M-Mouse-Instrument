<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIHULU — Performance Studio / UI concept — Detailed simulation</title><style>

f1b37a}aside{border-right:1px solid var(--line);padding:18px 11px;background:#16191e;display:flex;flex-direction:column;gap:6px}.section{font-size:10px;color:#8c95a3;font-weight:700;letter-spacing:1.3px;padding:15px 11px 4px}.nav{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:1px solid transparent;padding:10px;font-size:13px;color:#c0c6cf}.nav span{width:20px;text-align:center;font-size:16px}.nav[aria-current=true]{background:#293a34;border-color:#3d554a;color:#c6f2d7}.bottom{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px}main{padding:24px;min-width:0;max-width:1800px;width:100%;margin:auto;align-self:start}.intro{display:flex;gap:12px;align-items:center;margin-bottom:20px}.intro p{margin-top:5px;color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--accent);font-weight:700;margin-bottom:8px}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(250px,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;min-width:0}.card+.card{margin-top:13px}.layout>.card+.card{margin:0}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}.label{font-size:11px;color:var(--muted);display:block;margin-bottom:7px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}.fields select{width:100%;min-width:0}.surface{height:230px;border-radius:15px;background:#12161b;border:1px solid #414b53;display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;position:relative;margin:14px 0}.zone{display:flex;align-items:flex-end;justify-content:center;padding:10px 2px;border:0;border-right:1px solid #303a3c;border-radius:0;background:#19241f;color:#a4c4b1;font-size:12px;position:relative;touch-action:none}.zone:nth-child(even){background:#202a2a}.zone.root{background:#30473b;color:#d4f8df}.zone.hit{background:#78cfa2;color:#0d adding:16px}.layout{grid-template-columns:1fr}.brand small,.traffic{display:none}}@media(max-width:690px){.app{display:block}header{padding:9px;flex-wrap:wrap}.brand{font-size:12px}.brand .logo{display:none}header .pill{display:none}header button{font-size:11px;padding:7px}aside{display:flex;flex-direction:row;overflow:auto;border-right:0;padding:6px;gap:4px}.nav{white-space:nowrap;padding:8px}.section,.bottom{display:none}main{padding:12px}.intro{align-items:flex-start;flex-wrap:wrap}h1{font-size:22px}.fields{grid-template-columns:1fr 1fr}.devicegrid,.tilegrid,.routegrid{grid-template-columns:1fr}.surface{height:190px}.footer{position:static;padding:10px;flex-wrap:wrap}.matrix{grid-template-columns:65px repeat(16,23px)}.pad{min-height:70px}.card{padding:13px}}
</style><style>
.app{grid-template-columns:235px minmax(0,1fr)}aside{position:sticky;top:70px;max-height:calc(100vh - 112px);overflow:auto;align-self:start}.nav{font-size:12px}.nav[aria-current=true]{font-weight:650}.casegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.case{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:10px;min-width:0}.case p{color:var(--muted);font-size:12px;flex:1}.case h3{font-size:15px}.case .bar button{font-size:12px}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:15px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}.stat strong{font-size:24px;display:block;margin-top:5px;letter-spacing:-.6px}.tag{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:4px 7px;color:var(--muted);display:inline-block}.tag.good{color:#98d6b1;border-color:#486554}.tag.warn{color:#efbc83;border-color:#735c43}.tag.bad{color:#ff9da1;border-color:#794c52}.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}.subtabs button{padding:8px 12px}.tablewrap{overflow:auto}.data{border-collapse:collapse;width:100%;font-size:12px;text-align:left;white-space:nowrap}.data td,.data th{border-bottom:1px solid var(--line);padding:10px 8px}.data th{color:var(--muted);font-size:10px;font-weight:650;letter-spacing:.4px}.data td button{font-size:11px;padding:6px 8px}.data td input,.data td select{font-size:11px;max-width:175px;padding:6px}.tablewrap tr:last-child td{border:0}.tiny{font-size:11px;padding:6px 9px}.timeline{border-left:1px solid #535f59;margin-left:8px;padding-left:15px;display:grid;gap:12px}.timeline>div{position:relative}.timeline>div:before{content:"";position:absolute;left:-20px;top:4px;width:8px;height:8px;border-radius:100%;background:#a4d6b8}.timeline small{display:block}.casehero{background:linear-gradient(120deg,#24382f,#252b36);border:1px solid #475f53;padding:20px;border-radius:12px;margin:0 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#eef6f0}.casehero p{color:#b3c8bb;margin-top:6px}.pairflow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}.pairflow div{border:1px solid var(--line);border-radius:8px;padding:11px;font-size:12px}.pairflow .done{border-color:#5b9672;color:#97d9af}.pairflow .current{border-color:#e3b37b;color:#efbe87}.remotephone{max-width:340px;margin:auto;border:6px solid #454b54;border-radius:24px;background:#14171b;color:#e9edf1;padding:15px;box-shadow:0 8px 28px #0003}.remotephone .padgrid{grid-template-columns:repeat(4,1fr);gap:5px}.remotephone .pad{min-height:55px;font-size:11px;padding:5px}.remotephone .surface{height:160px}.remotephone .keyboard{height:85px}.phonebar{display:flex;justify-content:space-between;font-size:10px;margin-bottom:18px;color:#aeb9b1}.remotephone .subtabs button{font-size:11px;padding:6px}.fieldstack{display:grid;gap:10px}.fieldstack input,.fieldstack select{width:100%;min-width:0}.inlineform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.inlineform input{min-width:0;flex:1}.alert{border:1px solid #70444b;background:#38242a;color:#ffb9bd;border-radius:8px;padding:12px;font-size:12px;line-height:1.5}.light .tag.good{color:#24643c}.light .tag.warn{color:#8c5118}.light .tag.bad{color:#a92f38}.light .remotephone{color:#e9edf1}.light .casehero{color:#edf6ee}.light .casehero .muted{color:#c1d3c7}.light .timeline{border-color:#9faea5}.light .pairflow .done{color:#28663e}.light .pairflow .current{color:#8c5118}@media(max-width:1100px){.casegrid{grid-template-columns:repeat(2,1fr)}.statgrid{grid-template-columns:repeat(2,1fr)}.app{grid-template-columns:185px minmax(0,1fr)}}@media(max-width:690px){.app{display:block}aside{position:static;max-height:none;overflow:auto}.casegrid,.statgrid{grid-template-columns:1fr 1fr}.pairflow{grid-template-columns:repeat(2,1fr)}.casehero{padding:14px}}
</style></head><body><div class="app" id="app"><header><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand"><div class="logo">∿</div><div>TIHULU <small style="display:block;font-weight:400">Trackpad &amp; M. Mouse Instrument</small></div></div><span class="pill">UI CONCEPT · NOT LIVE</span><div class="spacer"></div><button id="capture" class="quiet" title="Simulated only">Capture off</button><button id="release" class="quiet">Release my controls</button><button id="panic" class="danger">■ Panic Stop · Esc</button></header><aside id="nav"></aside><main id="main"></main><footer class="footer"><span><i class="dot green" style="display:inline-block"></i> Offline demo</span><span id="status" role="status" aria-live="polite">Ready · all outputs off</span><span class="spacer"></span><span>No hardware access · no MIDI · no network</span></footer></div>
<script>
"use strict";
const $=s=>document.querySelector(s), nav=$("#nav"), main=$("#main"), status=$("#status");
const sections=[["PERFORM",["touch","◉","Touch Instrument"],["groups","▦","Instrument Groups"],["helper","≋","MIDI Helper"],["drums","▧","Drum Pads"],["seq","▤","Sequencers"]],["CREATE",["builder","⌘","Instrument Builder"],["voice","◌","Voice"],["audio","∿","Audio & Speaker"]],["CONNECT",["remote","⌁","Party Jam / Remote"],["gamepad","⊕","Gamepad & Pedals"]],["SYSTEM",["settings","⚙","Settings"],["diag","≡","Diagnostics"]]];
let sliderValues={},modeSessions=new Set(),page="touch",playing=false,capture=false,theme=false,stepState=new Set([0,4,8,12,20,28,34,38,42,46,48,56]),toggles={},choices={},groupArmed=false,events=[];
const notes=["C3","D3","E3","F3","G3","A3","B3","C4"], labels=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B","C"];
const log=t=>{status.textContent=t;events.unshift(t);events=events.slice(0,10)};
const title=(a,b,c="")=>'<div class="intro"><div><div class="eyebrow">PERFORMANCE STUDIO / '+a.toUpperCase()+'</div><h1>'+a+'</h1><p>'+b+'</p></div><div class="spacer"></div>'+c+'</div>';
const card=(h,body,extra="")=>'<section class="card"><div class="cardhead"><h2>'+h+'</h2><div class="spacer"></div>'+extra+'</div>'+body+'</section>';
const select=(l,arr)=>'<label><span class="label">'+l+'</span><select data-choice="'+l+'">'+arr.map(x=>'<option'+((choices[page+":"+l]||arr[0])===x?' selected':'')+'>'+x+'</option>').join("")+'</select></label>';
const toggle=(name,desc="")=>'<div class="line"><div><h3>'+name+'</h3><small>'+desc+'</small></div><button class="switch '+(toggles[name]?"active":"")+'" data-toggle="'+name+'" aria-pressed="'+!!toggles[name]+'">'+(toggles[name]?"On":"Off")+'</button></div>';
const slider=(l,v)=>{v=sliderValues[page+":"+l]??v;return '<label><span class="label">'+l+' <output>'+v+'%</output></span><input type="range" value="'+v+'" min="0" max="100" data-slider data-slider-key="'+page+":"+l+'"></label>'};
const device=(h,d,s)=>'<div class="device"><div class="bar"><h3>'+h+'</h3><div class="spacer"></div><span class="pill">'+s+'</span></div><p>'+d+'</p></div>';
const surface=()=>'<div class="surface" aria-label="Illustrative touch surface">'+notes.map((n,i)=>'<button class="zone '+(i===0||i===7?'root':'')+'" data-note="'+n+'">'+n+'</button>').join("")+'</div><div class="bar"><small>X · pitch / note zones</small><div class="spacer"></div><small>Contact size · illustrative only</small></div>';
const keyboard=()=>'<div class="keyboard">'+labels.map(n=>'<button class="key '+(n.includes("♯")?"black":"")+'" data-note="'+n+'3">'+n+'</button>').join("")+'</div>';
const start=()=>'<button class="primary" data-action="start">'+(playing?'■ Stop preview':'▶ Start preview')+'</button>';
const state=()=>'<span class="pill"><i class="dot '+(playing?'green':'')+'"></i> '+(playing?'Simulated active':'Inactive')+'</span>';
const route=()=>'<div class="fields">'+select("Output",["MIDI Instrument","Haptic","Both"])+select("MIDI mode",["MPE","Standard MIDI","GM Drums"])+select("Channel",["1","2","10","16"])+'</div>';
const expression=()=>toggle("Vibrato","Contact / position")+toggle("Pitch bend","Horizontal movement")+toggle("Expression","CC11 · vertical movement")+toggle("Sustain","CC64 · hold / toggle");
const screens={
touch:()=>title("Touch Instrument","Play expressive notes with your Mac trackpad or Magic Mouse.",start())+'<div class="layout"><div>'+card("Live surface",'<div class="fields">'+select("Surface",["Trackpad","Magic Mouse","Both"])+select("Mode",["Fretted","Fretless","Chords","Drums"])+select("Scale",["C major","A minor","D Dorian","Chromatic"])+'</div>'+surface()+keyboard()+'<div class="fields">'+select("Root",["C","D","E","F","G","A","B"])+select("Note trigger",["Touch hold","Click hold","Tap toggle","Contact threshold"])+select("Velocity",["Fixed","Contact size"])+'</div><div class="sliders">'+slider("Zone width",50)+slider("Sensitivity",68)+'</div>',state())+card("Connected surfaces",'<div class="devicegrid">'+device("Trackpad","Melodic · MPE · Logic MIDI","DEMO")+device("Magic Mouse","Independent mapping · idle","DEMO")+'</div>')+'</div><div>'+card("MIDI & output",route()+'<div class="line"><span>Virtual source</span><strong>TIHULU MIDI</strong></div><div class="line"><span>Active notes</span><strong id="noteCount">0</strong></div><div class="line"><span>Output state</span><small>Simulated / disconnected</small></div>')+card("Expression",expression()+select("Sustain mode",["Touch hold","Tap toggle","Click hold","Click toggle","Contact threshold"]))+card("Safety",'<div class="notice">All real outputs are off. Capture and Panic Stop here only affect the preview. No system permissions are requested.</div>')+'</div></div>',
groups:()=>title("Instrument Groups","Build a multi-surface performance rig. Each instrument starts off.",'<button class="primary" data-action="arm">Preview group '+(groupArmed?'off':'on')+'</button>')+'<div class="layout"><div>'+card("Performance layout",'<div class="tilegrid">'+["Lead • Trackpad","Bass • Magic Mouse","Drums • Gamepad","Chord pad • Tablet"].map((n,i)=>'<div class="device"><h3>'+n+'</h3><p>'+["MPE · melodic","MIDI · bass","GM channel 10","Remote · chord zones"][i]+'</p>'+toggle(n,"Mapped · available in demo")+'</div>').join("")+'</div>')+card("Group routing",'<div class="routegrid"><div class="node">Inputs<p>4 logical sources</p></div><div class="node">Ownership<p>Independent note gates</p></div><div class="node">Destinations<p>MIDI / MPE / haptic</p></div></div>')+'</div><div>'+card("Admission",'<div class="line">Mapped <b>4</b></div><div class="line">Available <b>Demo only</b></div><div class="line">Requested <b>'+(groupArmed?"Preview":"None")+'</b></div><div class="line">Acknowledged <b>None</b></div><div class="line">Actual output <b>OFF</b></div><div class="notice">Real group activation requires admission and neutral input. This UI never claims a hardware acknowledgement.</div>')+card("Pinned controls",toggle("Group sustain","Hold / toggle")+toggle("Group expression","Independent motion"))+'</div></div>',
helper:()=>title("MIDI Helper","Add expressive controls while playing a separate MIDI keyboard.",start())+'<div class="layout"><div>'+card("Controller surface",'<div class="fields">'+select("Surface",["Both","Trackpad","Magic Mouse"])+select("MIDI channel",["1","2","10","16"])+select("Target",["Logic Pro","Virtual MIDI"])+'</div>'+surface())+card("Live values",'<div class="sliders">'+slider("CC1 · modulation",25)+slider("CC11 · expression",65)+slider("Pitch bend",50)+slider("CC7 · volume",80)+'</div>')+'</div><div>'+card("Independent mappings",expression())+card("Pedal mapping",select("Trigger",["Touch hold","Tap toggle","Click hold","Click toggle"])+toggle("Polarity invert"))+'</div></div>',

screens.mixer=()=>priorMixer()+'<div class="wide">'+card("Source and helper assignments",table(["GROUP","PRIMARY","HELPERS","PORT"],S.groups.map(g=>[esc(g.name),esc(sourceName(g.source)),(g.helpers||[]).map(sourceName).map(esc).join(", ")||"—",esc(g.id)])))+'</div>';
const priorGroups=screens.groups;
screens.groups=()=>priorGroups()+'<div class="wide">'+card("Group routing projection",table(["GROUP","NOTE SOURCE","HELPER SOURCES","LOGICAL CHANNEL","ROUTES"],S.groups.map(g=>[esc(g.name),esc(sourceName(g.source)),(g.helpers||[]).map(sourceName).map(esc).join(", ")||"—",g.channel,S.routes.filter(q=>q.channel===g.channel&&[g.source,...(g.helpers||[])].includes(q.source)).length]))+'<p class="muted" style="margin-top:10px">Helper assignments are shown in profile recipes; individual route edits occur in Builder. Group arm is a simplified primary-source simulation, not a full multi-owner native group router.</p>')+'</div>';
const moreAbout=screens.about;screens.about=()=>moreAbout()+'<div class="wide">'+card("Browser-only data policy",'<p>Optional browser archive stores workspace configuration only when explicitly enabled and saved. It does not persist real hardware state, permissions, live sessions, sensor samples or secrets. No external requests, MIDI or audio APIs.</p>')+'</div>';
render();

<script>
"use strict";
// v4 UI state: drafts and visual instruments, no external APIs.
const vbtn=(a,n,c="tiny")=>'<button class="'+c+'" data-v4="'+a+'">'+n+'</button>';
const opt=(vals,current)=>vals.map(x=>{let a=Array.isArray(x)?x:[x,x];return '<option value="'+esc(a[0])+'" '+(String(a[0])===String(current)?"selected":"")+'>'+esc(a[1])+'</option>'}).join("");
const vselect=(id,vals,current,label)=>'<label><span class="label">'+label+'</span><select data-vfield="'+id+'">'+opt(vals,current)+'</select></label>';
const vinput=(id,value,label,type="text",range="")=>'<label><span class="label">'+label+'</span><input data-vfield="'+id+'" type="'+type+'" value="'+esc(value)+'" '+range+'></label>';
const signalList=id=>id.startsWith("gp")?["Button A","Button B","Button X","Button Y","Left X","Left Y","Right X","Right Y","Left trigger","Right trigger"]:remoteIds.includes(id)?["Contact","X","Y","Tilt roll","Tilt pitch","Relative yaw","Acceleration","Rotation","Pedal sustain","Pedal expression","Pedal wah","Pedal volume","Pedal switch 1","Pedal switch 2",...Array.from({length:8},(_,i)=>"Pad "+(i+1)),...Array.from({length:25},(_,i)=>"Key "+(48+i))]:id==="cam"?["X","Y","Gesture","Contact"]:id==="lid"?["Angle"]:id==="tb"?["X","Contact"]:["Contact","X","Y","Contact size",...Array.from({length:16},(_,i)=>"Pad "+(i+1))];
const targets=["Note 60","Note 36","Note 38","Note 42","Chord Cmaj","CC1 Modulation","CC4 Wah","CC7 Volume","CC10 Pan","CC11 Expression","CC64 Sustain","CC71 Resonance","CC74 Cutoff","CC80 Switch","Pitch Bend"];
const sources=definitions.map(([id,n])=>[id,n]);
const blocked=()=>S.ports||S.debt||S.panic||armed()||held()||modeSessions.size||capture||groupArmed;
const v4notice=t=>'<div class="notice">'+esc(t)+'</div>';
let wizard={step:0,name:"My performance rig",role:"Expressive lead",sources:["tp"],channel:1,output:"MIDI",helper:true};
let graph={inputs:[],processors:[],outputs:[],seq:0,loaded:false};let graphMessage="",graphBase="";
let touchContacts=new Map(),touchSelected=1,touchSustain=false,touchLayout="Fretted",touchSource="tp",touchRange=12;
const phoneState=Object.fromEntries(remoteIds.map(id=>[id,{tab:"Play",mode:id==="ph1"?"Drum pads":id==="ta1"?"Piano":id==="ph2"?"XY":"Pedalboard",enabled:false,octave:0,held:new Set(),pedal:false,active:{},values:{Expression:127,Volume:127,Wah:0},sensors:new Set()}]));
let mobileView="ph1",mobileCompare=false;
let v4Checks=[];
function graphFromRoutes(){graphBase=JSON.stringify(S.routes);graph={inputs:[],processors:[],outputs:[],seq:0,loaded:true};const next=()=>String(++graph.seq);for(const q of S.routes){let x=graph.inputs.find(n=>n.source===q.source&&n.signal===q.signal);if(!x){x={id:next(),source:q.source,signal:q.signal};graph.inputs.push(x)}let cal=q.calibration||{min:0,max:127,invert:false,curve:"Linear",smoothing:0};let p=graph.processors.find(n=>n.input===x.id&&JSON.stringify(n.cal)===JSON.stringify(cal));if(!p){p={id:next(),input:x.id,cal:clone(cal)};graph.processors.push(p)}graph.outputs.push({id:next(),processor:p.id,target:q.target,channel:Number(q.channel),release:q.release,label:q.label||""})}graphMessage="Draft loaded from "+S.routes.length+" mappings."}
function compileGraph(g){let out=[],errors=[];if(g.outputs.length>64)errors.push("64 output route limit exceeded");for(const o of g.outputs){let p=g.processors.find(x=>x.id===o.processor),i=p&&g.inputs.find(x=>x.id===p.input);if(!i||!p){errors.push("Output "+o.id+" has no complete connection");continue}if(!signalList(i.source).includes(i.signal)){errors.push("Unsupported input signal on "+o.id);continue}let c=p.cal;if(!Number.isFinite(c.min)||!Number.isFinite(c.max)||c.min<0||c.max>127||c.min>=c.max||c.smoothing<0||c.smoothing>100){errors.push("Invalid calibration "+p.id);continue}if(!Number.isInteger(o.channel)||o.channel<1||o.channel>16||!o.target){errors.push("Invalid target "+o.id);continue}if(/^CC(7|11) /.test(o.target)&&o.release==="Hold last"){errors.push("Explicit neutral required for "+o.target);continue}out.push({...rr(i.source,i.signal,o.target,o.channel,o.label,o.release),calibration:clone(c)})}let keys=new Set();for(const q of out){let k=q.channel+":"+q.target;if(keys.has(k))errors.push("Repeated MIDI target "+k+"; edit arbitration before applying");keys.add(k)}return {ok:!errors.length&&out.length>0,routes:out,errors:errors.length?errors:out.length?[]:["No output routes"]}}
function graphAdd(kind){if(graph[kind].length>=64){graphMessage="Node capacity reached";return}let id=String(++graph.seq);if(kind==="inputs")graph.inputs.push({id,source:"tp",signal:"X"});if(kind==="processors")graph.processors.push({id,input:graph.inputs[0]?.id||"",cal:{min:0,max:127,invert:false,curve:"Linear",smoothing:0}});if(kind==="outputs")graph.outputs.push({id,processor:graph.processors[0]?.id||"",target:"CC11 Expression",channel:1,release:"0",label:"New output"});graph.loaded=true;graphMessage="Draft changed"}
function graphRemove(kind,id){graph[kind]=graph[kind].filter(x=>x.id!==id);if(kind==="inputs")graph.processors.filter(x=>x.input===id).forEach(x=>x.input="");if(kind==="processors")graph.outputs.filter(x=>x.processor===id).forEach(x=>x.processor="");graphMessage="Node removed; disconnected links remain visible."}
function graphApply(){if(graphBase!==JSON.stringify(S.routes)){graphMessage="Builder draft changed since graph opened. Reload before applying.";return false}if(blocked()){graphMessage="Stop sessions, release controls and close ports before applying.";return false}let result=compileGraph(graph);if(!result.ok){graphMessage=result.errors.join(" · ");return false}S.routes=result.routes;S.routes.forEach(q=>S.devices[q.source].mapped=true);S.draft=true;graphBase=JSON.stringify(S.routes);graphMessage="Applied "+S.routes.length+" draft routes; no output started.";trace(graphMessage);return true}
screens.patchbay=()=>title("Visual Patchbay","Connect inputs → calibration → MIDI outputs. Fan-out is explicit; draft only.",vbtn("graphLoad","Load current routes","primary"))+card("Graph workspace",'<div class="v4toolbar">'+vbtn("graphLoad","Reload / reset draft")+vbtn("graphBlank","Blank graph")+vbtn("graphValidate","Validate connections")+vbtn("graphApply","Apply connections","primary")+'<span class="muted">'+esc(graphMessage||"Load current Builder routes or create a blank graph.")+'</span></div><div class="graphstage"><div class="v4grid"><div><div class="graphhead"><b>01</b> Inputs</div>'+graph.inputs.map(n=>'<div class="v4node"><div class="bar"><h3>Input '+n.id+'</h3><div class="spacer"></div>'+vbtn("graphRemove:inputs:"+n.id,"Remove")+'</div>'+vselect("gi:"+n.id+":source",sources,n.source,"Source")+vselect("gi:"+n.id+":signal",signalList(n.source),n.signal,"Signal")+'<small>'+graph.processors.filter(p=>p.input===n.id).length+' downstream processor(s) →</small></div>').join("")+vbtn("graphAdd:inputs","+ Add input")+'</div><div><div class="graphhead"><b>02</b> Calibration</div>'+graph.processors.map(n=>'<div class="v4node"><div class="bar"><h3>Processor '+n.id+'</h3><div class="spacer"></div>'+vbtn("graphRemove:processors:"+n.id,"Remove")+'</div>'+vselect("gp:"+n.id+":input",[["","Not connected"],...graph.inputs.map(i=>[i.id,"Input "+i.id+" · "+sourceName(i.source)+" / "+i.signal])],n.input,"Incoming connection")+vinput("gc:"+n.id+":min",n.cal.min,"Minimum","number",'min="0" max="127"')+vinput("gc:"+n.id+":max",n.cal.max,"Maximum","number",'min="0" max="127"')+vselect("gc:"+n.id+":invert",[["false","Normal"],["true","Inverted"]],n.cal.invert,"Polarity")+vselect("gc:"+n.id+":curve",["Linear","Exponential","Logarithmic"],n.cal.curve,"Curve")+vinput("gc:"+n.id+":smoothing",n.cal.smoothing,"Smoothing %","number",'min="0" max="100"')+'<small>'+graph.outputs.filter(o=>o.processor===n.id).length+' output connection(s) →</small></div>').join("")+vbtn("graphAdd:processors","+ Add processor")+'</div><div><div class="graphhead"><b>03</b> MIDI outputs</div>'+graph.outputs.map(n=>'<div class="v4node"><div class="bar"><h3>Output '+n.id+'</h3><div class="spacer"></div>'+vbtn("graphRemove:outputs:"+n.id,"Remove")+'</div>'+vselect("go:"+n.id+":processor",[["","Not connected"],...graph.processors.map(p=>[p.id,"Processor "+p.id])],n.processor,"Incoming connection")+vselect("go:"+n.id+":target",[...new Set([n.target,...targets])],n.target,"MIDI destination")+vselect("go:"+n.id+":channel",Array.from({length:16},(_,i)=>i+1),n.channel,"Channel")+vselect("go:"+n.id+":release",["0","64","127","Hold last"],n.release,"Release value")+vinput("go:"+n.id+":label",n.label,"Custom label")+'</div>').join("")+vbtn("graphAdd:outputs","+ Add output")+'</div></div></div>')+'<div class="wide layout"><div>'+card("Compiled route projection",table(["INPUT","SIGNAL","TARGET","CHANNEL"],compileGraph(graph).routes.map(q=>[esc(sourceName(q.source)),esc(q.signal),esc(q.target),q.channel])))+'</div><div>'+card("Draft policy",v4notice("Only complete connections compile. Applying replaces Builder draft mappings, not native runtime. Unused nodes are not stored. Reload discards graph-only edits.")+vbtn("goBuilder","Back to Builder"))+'</div></div>';
function wizardRoutes(w){let src=w.sources[0],ch=w.channel,out=[];if(!src)return out;for(let i=0;i<w.sources.length;i++){let id=w.sources[i],helper=i>0&&w.helper,channel=helper?ch:((ch-1+i)%16)+1;let ss=signalList(id),binary=ss.includes("Contact")?"Contact":ss.includes("Button A")?"Button A":ss[0],x=ss.includes("X")?"X":ss.includes("Left X")?"Left X":ss[0],y=ss.includes("Y")?"Y":ss.includes("Left Y")?"Left Y":ss[0];if(helper||w.role==="MIDI Helper"){out.push(rr(id,x,"CC1 Modulation",channel,"Modulation"),rr(id,y,"CC11 Expression",channel,"Expression"));if(ss.includes("Contact")||ss.includes("Button A"))out.push(rr(id,binary,"CC64 Sustain",channel,"Sustain"))}else if(w.role==="Drum controller"){let pads=ss.filter(z=>z.startsWith("Pad ")).slice(0,8);if(!pads.length)pads=[binary];pads.forEach((p,j)=>out.push(rr(id,p,"Note "+[36,38,42,46,45,47,49,51][j],10,"Drum "+(j+1))))}else if(w.role==="Pedalboard"){out.push(rr(id,binary,"CC64 Sustain",channel,"Sustain"),rr(id,x,"CC4 Wah",channel,"Wah"),rr(id,y,"CC11 Expression",channel,"Expression"))}else if(["cam","lid","tb"].includes(id)){out.push(rr(id,x,"CC11 Expression",channel,"Continuous control"))}else{out.push(rr(id,binary,"Note 60",channel,"Note gate"),rr(id,x,"Pitch Bend",channel,"Pitch","64"),rr(id,y,w.helper&&w.sources.length>1?"CC74 Cutoff":"CC11 Expression",channel,w.helper&&w.sources.length>1?"Filter":"Dynamics"))}}return out}
function wizardErrors(w){let es=[];if(!w.name.trim())es.push("Name is required");if(!w.sources.length)es.push("Select at least one source");if(w.sources.length>8)es.push("Choose at most eight sources for this demo recipe");let q=wizardRoutes(w);if(q.length>64)es.push("Route capacity exceeded");if(q.some(x=>!signalList(x.source).includes(x.signal)))es.push("Unsupported source signal");if(q.some(x=>["cam","lid","tb"].includes(x.source)&&/^(Note|Chord|CC64)/.test(x.target)))es.push("Camera, lid and ribbon group recipes use continuous controls only");let keys=new Set();for(const x of q){let k=x.channel+":"+x.target;if(keys.has(k))es.push("Shared destination "+k+" requires separate groups or manual mapping");keys.add(k)}return [...new Set(es)]}
function wizardApply(){let es=wizardErrors(wizard);if(blocked()){trace("Stop active sessions and resolve safety state before replacing workspace","HOLD");return false}if(es.length){trace(es.join(" · "),"HOLD");return false}let w=clone(wizard),routes=wizardRoutes(w);touchClear();remoteIds.forEach(phoneRelease);fresh();S.routes=routes;w.sources.forEach(id=>S.devices[id].mapped=true);S.groups=(w.helper?[w.sources[0]]:w.sources).map((id,i)=>({id:"g"+(++S.groupCounter),name:w.name+(i?" "+(i+1):""),source:id,helpers:w.helper?w.sources.slice(1):[],channel:w.role==="Drum controller"?10:((w.channel-1+i)%16)+1,active:false,muted:false}));S.draft=true;S.saved.push({name:w.name,sources:w.sources,groups:clone(S.groups),routes:clone(routes),profile:null,choices:{},sliders:{},pattern:[...stepState],output:w.output});persist();trace("Custom workspace prepared inactive · "+routes.length+" draft mappings");page="profiles";return true}
screens.wizard=()=>title("Create Workspace","Guided custom profile · design a rig without starting it.",vbtn("wizardReset","Reset wizard"))+card("Workspace builder",'<div class="v4step">'+["Identity","Sources","Routing","Review"].map((n,i)=>'<span class="'+(i===wizard.step?"current":i<wizard.step?"done":"")+'">'+(i+1)+' · '+n+'</span>').join("")+'</div>'+wizardPage()+'<div class="bar" style="margin-top:20px">'+vbtn("wizardBack","Back")+'<div class="spacer"></div>'+vbtn(wizard.step===3?"wizardApply":"wizardNext",wizard.step===3?"Create inactive workspace":"Continue","primary")+'</div>')+'<div class="wide">'+card("Draft summary",stats([["Selected sources",wizard.sources.length],["Mappings",wizardRoutes(wizard).length],["Output",wizard.output],["Actual output","OFF"]])+table(["SOURCE","SIGNAL","TARGET","CH"],wizardRoutes(wizard).map(x=>[esc(sourceName(x.source)),esc(x.signal),esc(x.target),x.channel])))+'</div>';
function wizardPage(){if(wizard.step===0)return '<div class="fieldstack">'+vinput("wiz:name",wizard.name,"Workspace name")+vselect("wiz:role",["Expressive lead","Drum controller","MIDI Helper","Pedalboard"],wizard.role,"Performance role")+v4notice("This prepares an editable configuration, not a device connection.")+'</div>';if(wizard.step===1)return '<div class="tilegrid">'+definitions.map(([id,n,d])=>'<label class="v4source"><input type="checkbox" data-vfield="wizSource:'+id+'" '+(wizard.sources.includes(id)?"checked":"")+'><div><h3>'+esc(n)+'</h3><small>'+esc(d)+'</small></div></label>').join("")+'</div>';if(wizard.step===2)return '<div class="fieldstack">'+vselect("wiz:channel",Array.from({length:16},(_,i)=>i+1),wizard.channel,"Base logical channel")+vselect("wiz:output",["MIDI","Haptic","Both"],wizard.output,"Preferred output (configuration only)")+vselect("wiz:helper",[["true","First source plays; remaining sources are helpers"],["false","Separate groups for each source"]],wizard.helper,"Source assignment")+'</div>';return '<h2>'+esc(wizard.name)+'</h2><p style="margin:10px 0">'+esc(wizard.role)+" · "+esc(wizard.output)+'</p>'+v4notice(wizardErrors(wizard).join(" · ")||"Configuration ready to prepare. No real connection, playback or permission request.")}

const notesV4=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const noteName=n=>notesV4[n%12]+(Math.floor(n/12)-1);
function touchPut(id,x,y){if(touchContacts.size>=10&&!touchContacts.has(id)){trace("Ten visual contacts already present","HOLD");return}let old=touchContacts.get(id),note=48+Math.round(x*touchRange);touchContacts.set(id,{x,y,note,held:true});if(!old||old.note!==note)addWire(touchSource,"Visual contact "+id,noteName(note),Math.round(y*127),"Illustrative contact")}
function touchLift(id){let x=touchContacts.get(id);if(!x)return;if(touchSustain){x.held=false}else touchContacts.delete(id)}

ck("Patchbay invalid apply atomic",()=>{let n=JSON.stringify(S.routes);return !graphApply()&&JSON.stringify(S.routes)===n});
ck("Patchbay stale draft rejected",()=>{graphFromRoutes();S.routes.push(rr("tp","X","CC74 Cutoff",2,"extra"));let n=JSON.stringify(S.routes);return !graphApply()&&JSON.stringify(S.routes)===n});
ck("Patchbay reload and apply",()=>{graphFromRoutes();return graphApply()});
ck("Custom workspace valid inactive draft",()=>{fresh();wizard={step:3,name:"Test custom",role:"Expressive lead",sources:["tp","mm"],channel:1,output:"Both",helper:true};return wizardErrors(wizard).length===0&&wizardRoutes(wizard).length===6});
ck("Wizard shared target conflict",()=>wizardErrors({...wizard,sources:["tp","mm","gp1"]}).length>0);
ck("Visual contact sustain release",()=>{touchClear();touchPut(1,.2,.5);touchSustain=true;touchLift(1);let retained=touchContacts.size===1&&!touchContacts.get(1).held;v4Action("touchSustain");return retained&&touchContacts.size===0});
ck("Visual range updates pitch",()=>{touchClear();touchRange=12;touchPut(1,.5,.5);vfield("touch:range","24");return touchContacts.get(1).note===60});
ck("Mobile 25-key preset idempotent",()=>{fresh();let a=mobileInsert("ta1","Piano"),n=S.routes.length,b=mobileInsert("ta1","Piano");return a&&b&&n===26&&S.routes.length===26});
ck("Mobile note press and release",()=>{connectId("ta1");armId("ta1");phoneState.ta1.enabled=true;phoneToggle("ta1","Key 48");let n=phoneState.ta1.held.size;phoneToggle("ta1","Key 48");return n===1&&phoneState.ta1.held.size===0});
ck("Mobile release retains reservation",()=>{v4Action("phoneRelease","ta1");return S.devices.ta1.reserved&&!S.devices.ta1.armed&&!phoneState.ta1.enabled});
ck("Mobile preset capacity atomic",()=>{fresh();S.routes=Array.from({length:60},(_,i)=>rr("tp","X","Note "+i,1,"x"));return !mobileInsert("ta1","Piano")&&S.routes.length===60});
ck("Unsupported sensor preset rejected",()=>{fresh();return !mobileInsert("ph1","Air Drums")&&S.routes.length===0});
}finally{S=s;modeSessions=new Set(m);choices=c;sliderValues=sv;toggles=tg;page=sp;capture=cap;playing=pl;groupArmed=ga;status.textContent=st;events=ev;wire=w;consoleHeld=hc;consoleSustain=su;consoleLast=ls;monoClock=clock;mix=oldMix;stepState=new Set(pattern);restoreV4(vis)}runChecks=checks;return checks}
document.addEventListener("click",e=>{let b=e.target.closest("[data-v4]");if(b?.dataset.v4==="extendedChecks"){extendedChecks();render();e.preventDefault();e.stopPropagation()}},true);
const oldTestsV4=screens.tests;screens.tests=()=>oldTestsV4().replace('data-sim="runChecks"','data-v4="extendedChecks"')+'<div class="wide">'+card("Extended coverage",'<p>Patchbay round-trip and stale drafts; wizard validation; multi-touch visual sustain; mobile mapping capacity, press/release and reservations. Tests restore UI configuration and visual controls.</p>')+'</div>';

.v5graph{overflow:auto;max-height:530px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:14px}.v5graph svg{display:block;min-width:600px;width:100%;height:auto}.v5controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.v5widget{border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--panel);min-width:0;display:grid;gap:9px}.v5widget[draggable=true]{cursor:grab}.v5widget.dragover{outline:2px dashed var(--accent)}.v5widget .bar{gap:5px}.v5widget input[type=range]{width:100%;accent-color:var(--accent)}.v5widget .v4surface{height:115px}.v5widget .pad{min-height:52px;width:100%}.v5widget .tiny{padding:5px 7px}.v5status{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.v5topo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.v5topo .device{border-left:3px solid #718e7d}.v5topo .device.offline{border-left-color:#535b64}.v5topo .line{font-size:12px}.v5owner{border:1px solid var(--line);border-radius:7px;padding:7px;margin-bottom:7px;font-size:12px}.v5foot{font-size:10px;color:var(--muted);padding-top:6px}.v5filters{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:12px}@media(max-width:900px){.v5controls{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:690px){.v5controls,.v5topo{grid-template-columns:1fr}}
</style>
<script>
"use strict";
let layoutDraft=[],layoutBase="",layoutLoaded=false,layoutMessage="",layoutSource="all",layoutSeq=0,layoutDrag=null,layoutValues={},topologyFilter="all",graphFilter="all";
const layoutKinds=["Slider","Toggle","Momentary pad","XY surface","Piano key"];
const layoutKey=w=>w.source+"|"+w.signal;
function layoutDefault(){let seen=new Set();return S.routes.filter(q=>{let k=q.source+"|"+q.signal;if(seen.has(k))return false;seen.add(k);return true}).map(q=>({id:"w"+(++layoutSeq),source:q.source,signal:q.signal,label:q.label||q.signal,kind:/^(Note|Chord|CC64)/.test(q.target)?"Momentary pad":"Slider",color:"Mint"}))}
function layoutOpen(){layoutBase=JSON.stringify([S.routes,S.controlLayout||[]]);layoutDraft=clone(S.controlLayout?.length?S.controlLayout:layoutDefault());layoutLoaded=true;layoutMessage="Draft opened · dormant controls retained.";layoutValues={};layoutSeq=Math.max(layoutSeq,...layoutDraft.map(w=>Number(w.id.slice(1))||0))}
function widgetMapped(w){return S.routes.some(q=>q.source===w.source&&q.signal===w.signal)}
function layoutMove(id,delta){let i=layoutDraft.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=layoutDraft.length)return false;[layoutDraft[i],layoutDraft[j]]=[layoutDraft[j],layoutDraft[i]];return true}
function layoutReorder(from,to){let i=layoutDraft.findIndex(x=>x.id===from),j=layoutDraft.findIndex(x=>x.id===to);if(i<0||j<0||i===j)return false;let [w]=layoutDraft.splice(i,1);layoutDraft.splice(j,0,w);return true}
function layoutSave(){if(!layoutLoaded){layoutMessage="Open a draft first";return false}if(blocked()){layoutMessage="Stop active sessions and close ports before saving.";return false}if(layoutBase!==JSON.stringify([S.routes,S.controlLayout||[]])){layoutMessage="Workspace changed. Reload the layout before saving.";return false}if(layoutDraft.length>64||layoutDraft.some(w=>!w.label.trim()||!S.devices[w.source]||!signalList(w.source).includes(w.signal)||!layoutKinds.includes(w.kind))||new Set(layoutDraft.map(w=>w.id)).size!==layoutDraft.length){layoutMessage="Invalid layout or widget capacity exceeded";return false}S.controlLayout=clone(layoutDraft);layoutBase=JSON.stringify([S.routes,S.controlLayout]);layoutMessage="Saved "+layoutDraft.length+" widgets · unmapped widgets retained but inactive.";trace(layoutMessage);return true}
function graphSVG(){let input=graph.inputs,proc=graph.processors,out=graph.outputs;if(graphFilter!=="all"){input=input.filter(x=>x.source===graphFilter);let ids=new Set(input.map(x=>x.id));proc=proc.filter(x=>ids.has(x.input));let pids=new Set(proc.map(x=>x.id));out=out.filter(x=>pids.has(x.processor))}let max=Math.max(input.length,proc.length,out.length,1),H=48+max*42,ys=(list,id)=>{let i=list.findIndex(x=>x.id===id);return i<0?null:41+i*42};let line=(x1,y1,x2,y2,c)=>y1===null||y2===null?"":'<path d="M'+x1+' '+y1+' C'+(x1+50)+' '+y1+' '+(x2-50)+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="'+c+'" stroke-width="1.7" opacity=".7"/>';let node=(x,y,a,b,clr)=>'<g><rect x="'+x+'" y="'+(y-16)+'" width="188" height="32" rx="6" fill="#252d2b" stroke="'+clr+'"/><text x="'+(x+8)+'" y="'+(y-2)+'" fill="#e2f1e7" font-size="10">'+esc(String(a).slice(0,29))+'</text><text x="'+(x+8)+'" y="'+(y+10)+'" fill="#a8b8b0" font-size="8">'+esc(String(b).slice(0,35))+'</text></g>';return '<div class="v5graph"><svg viewBox="0 0 780 '+H+'" role="img" aria-label="Connections diagram">'+[["INPUT",14],["CALIBRATION",296],["MIDI OUTPUT",578]].map(([n,x])=>'<text x="'+x+'" y="15" fill="#8db49d" font-size="10">'+n+'</text>').join("")+proc.map(p=>line(202,ys(input,p.input),296,ys(proc,p.id),"#75cba0")).join("")+out.map(o=>line(484,ys(proc,o.processor),578,ys(out,o.id),"#b5a7f1")).join("")+input.map(i=>node(14,ys(input,i.id),sourceName(i.source),i.signal+" · "+i.id,"#648e74")).join("")+proc.map(p=>node(296,ys(proc,p.id),"Processor "+p.id,p.cal.curve+" · "+p.cal.min+"–"+p.cal.max,"#83978d")).join("")+out.map(o=>node(578,ys(out,o.id),o.target,"CH "+o.channel+" · "+o.label,"#9b90c5")).join("")+'</svg></div>'}
const graphScreenV5=screens.patchbay;screens.patchbay=()=>{let base=graphScreenV5();return base.replace('<div class="graphstage">','<div class="v5filters">'+vselect("v5:graphFilter",[["all","All sources"],...sources],graphFilter,"Connection overview filter")+'</div>'+graphSVG()+'<div class="graphstage">')};
function layoutPreview(w){let active=widgetMapped(w),value=layoutValues[w.id]??0;return w.kind==="Slider"?'<input type="range" min="0" max="127" value="'+value+'" data-vfield="lv:'+w.id+'" aria-label="'+esc(w.label)+'" '+(active?"":"disabled")+'><small>'+value+' / 127</small>':w.kind==="XY surface"?'<div class="v4surface" data-layoutxy="'+w.id+'"><span class="surfaceCaption">Illustrative XY</span></div>':vbtn("layoutPulse:"+w.id,value?"Release":"Press",active?(value?"active":"pad"):"tiny");}
function layoutWidget(w){return '<article class="v5widget" draggable="true" data-widget="'+w.id+'"><div class="bar"><h3>'+esc(w.label)+'</h3><div class="spacer"></div>'+tag(widgetMapped(w)?"Mapped":"Dormant",widgetMapped(w)?"good":"warn")+'</div>'+vinput("lw:"+w.id+":label",w.label,"Label")+vselect("lw:"+w.id+":source",sources,w.source,"Source")+vselect("lw:"+w.id+":signal",signalList(w.source),w.signal,"Signal")+vselect("lw:"+w.id+":kind",layoutKinds,w.kind,"Control style")+layoutPreview(w)+'<div class="bar">'+vbtn("layoutUp:"+w.id,"↑")+vbtn("layoutDown:"+w.id,"↓")+vbtn("layoutRemove:"+w.id,"Remove")+'</div></article>'}
screens.layouteditor=()=>title("Control Layout","Design the arrangement of controls while retaining dormant mappings.",vbtn("layoutOpen","Load / reset draft","primary"))+card("Layout editor",'<div class="v4toolbar">'+vbtn("layoutOpen","Reload saved layout")+vbtn("layoutDefaults","Build from routes")+vbtn("layoutAdd","Add widget")+vbtn("layoutSave","Save layout","primary")+'</div><div class="line"><span>'+layoutDraft.length+' / 64 widgets</span>'+tag(layoutDraft.filter(w=>!widgetMapped(w)).length+" dormant")+'</div><p class="muted">'+esc(layoutMessage||"Open the current control layout. Changes do not affect MIDI or hardware.")+'</p><div class="v5filters" style="margin-top:12px">'+vselect("v5:layoutSource",[["all","All sources"],...sources],layoutSource,"Filter")+'</div><div class="v5controls">'+layoutDraft.filter(w=>layoutSource==="all"||w.source===layoutSource).map(layoutWidget).join("")+'</div>')+'<div class="wide">'+card("Layout policy",v4notice("Drag a widget onto another, or use arrow buttons. Filtering does not delete widgets. Dormant controls are retained in saved layouts; unmapped controls cannot send mock values. Save the workspace separately to archive the layout."))+'</div>';
screens.topology=()=>title("Connection Topology","Review device bindings, group assignments and logical MIDI targets.",vbtn("topoReset","Show all"))+summaries()+card("Source map",'<div class="v5filters">'+vselect("v5:topologyFilter",[["all","All sources"],["mapped","Mapped only"],["connected","Connected only"],["armed","Armed only"]],topologyFilter,"Visibility")+'</div><div class="v5topo">'+definitions.filter(([id])=>topologyFilter==="all"||S.devices[id][topologyFilter]).map(([id,n,d])=>{let x=S.devices[id],gs=S.groups.filter(g=>g.source===id||(g.helpers||[]).includes(id)),qs=S.routes.filter(q=>q.source===id);return '<div class="device '+(x.connected?"":"offline")+'"><div class="bar"><h3>'+esc(n)+'</h3><div class="spacer"></div>'+tag(x.armed?"Armed":x.connected?"Connected":"Offline",x.armed?"good":"")+'</div><p>'+esc(d)+'</p><div class="line">Logical groups <b>'+gs.length+'</b></div>'+gs.map(g=>'<div class="v5owner">'+esc(g.name)+' · '+(g.source===id?"Primary":"Helper")+' · CH '+g.channel+'</div>').join("")+'<div class="line">Mappings <b>'+qs.length+'</b></div>'+qs.slice(0,6).map(q=>'<div class="v5foot">'+esc(q.signal)+' → '+esc(q.target)+' · CH '+esc(q.channel)+'</div>').join("")+(qs.length>6?'<small>+'+(qs.length-6)+' more mappings</small>':"")+'<div class="bar" style="margin-top:10px">'+btn("connect:"+id,"Connect")+btn("arm:"+id,"Arm")+btn("release:"+id,"Release")+'</div></div>'}).join("")+'</div>')+'<div class="wide">'+card("Connection flow",'<div class="routegrid"><div class="node">Mapped inputs<p>Explicit source bindings</p></div><div class="node">Logical ownership<p>Group, Helper and release state</p></div><div class="node">Receiver<p>DAW routing remains unverified</p></div></div>')+'</div>';
const priorBuilder5=screens.builder;screens.builder=()=>priorBuilder5()+'<div class="wide">'+card("Custom control arrangement",vbtn("layoutGo","Open Control Layout","primary")+" "+btn("open:topology","Connection topology"))+'</div>';
const priorConnections5=screens.connections;screens.connections=()=>priorConnections5()+'<div class="wide">'+card("Connection topology",btn("open:topology","Inspect mapped sources and groups","primary"))+'</div>';
sections[3].push(["layouteditor","▦","Control Layout"]);sections[0].push(["topology","⌘","Connection Topology"]);
document.addEventListener("change",e=>{let k=e.target.dataset.vfield;if(!k)return;let [a,id,key]=k.split(":");if(a==="v5"){if(id==="graphFilter")graphFilter=e.target.value;if(id==="layoutSource")layoutSource=e.target.value;if(id==="topologyFilter")topologyFilter=e.target.value;render()}if(a==="lw"){let w=layoutDraft.find(w=>w.id===id);if(!w)return;w[key]=e.target.value;if(key==="source"&&!signalList(w.source).includes(w.signal))w.signal=signalList(w.source)[0];layoutMessage="Draft changed";render()}if(a==="lv"){let w=layoutDraft.find(w=>w.id===id);if(w&&widgetMapped(w)){layoutValues[id]=Math.max(0,Math.min(127,Number(e.target.value)||0));render()}}});
document.addEventListener("click",e=>{let b=e.target.closest("[data-v4]");if(!b)return;let [a,id]=b.dataset.v4.split(":");let handled=true;switch(a){case"layoutGo":layoutOpen();page="layouteditor";break;case"layoutOpen":layoutOpen();break;case"layoutDefaults":if(!layoutLoaded)layoutOpen();layoutDraft=layoutDefault();layoutMessage="Rebuilt from mapped routes · save to replace prior layout";break;case"layoutAdd":if(!layoutLoaded)layoutOpen();if(layoutDraft.length<64)layoutDraft.push({id:"w"+(++layoutSeq),source:"tp",signal:"X",kind:"Slider",label:"New control",color:"Mint"});break;case"layoutSave":layoutSave();break;case"layoutUp":layoutMove(id,-1);break;case"layoutDown":layoutMove(id,1);break;case"layoutRemove":layoutDraft=layoutDraft.filter(w=>w.id!==id);break;case"layoutPulse":{let w=layoutDraft.find(w=>w.id===id);if(w&&widgetMapped(w))layoutValues[id]=layoutValues[id]?0:127;break}case"topoReset":topologyFilter="all";break;default:handled=false}if(handled){e.preventDefault();e.stopPropagation();render()}},true);
document.addEventListener("dragstart",e=>{let w=e.target.closest?.("[data-widget]");if(w){layoutDrag=w.dataset.widget;e.dataTransfer?.setData("text/plain",layoutDrag)}});
document.addEventListener("dragover",e=>{let w=e.target.closest?.("[data-widget]");if(w&&layoutDrag)e.preventDefault()});
document.addEventListener("drop",e=>{let w=e.target.closest?.("[data-widget]");if(w&&layoutDrag){e.preventDefault();layoutReorder(layoutDrag,w.dataset.widget);layoutDrag=null;render()}});
document.addEventListener("dragend",()=>{layoutDrag=null});
render();
</script></body></html>
