<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIHULU — Performance Studio / UI concept — Detailed simulation</title><style>

f1b37a}aside{border-right:1px solid var(--line);padding:18px 11px;background:#16191e;display:flex;flex-direction:column;gap:6px}.section{font-size:10px;color:#8c95a3;font-weight:700;letter-spacing:1.3px;padding:15px 11px 4px}.nav{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:1px solid transparent;padding:10px;font-size:13px;color:#c0c6cf}.nav span{width:20px;text-align:center;font-size:16px}.nav[aria-current=true]{background:#293a34;border-color:#3d554a;color:#c6f2d7}.bottom{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px}main{padding:24px;min-width:0;max-width:1800px;width:100%;margin:auto;align-self:start}.intro{display:flex;gap:12px;align-items:center;margin-bottom:20px}.intro p{margin-top:5px;color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--accent);font-weight:700;margin-bottom:8px}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(250px,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;min-width:0}.card+.card{margin-top:13px}.layout>.card+.card{margin:0}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}.label{font-size:11px;color:var(--muted);display:block;margin-bottom:7px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}.fields select{width:100%;min-width:0}.surface{height:230px;border-radius:15px;background:#12161b;border:1px solid #414b53;display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;position:relative;margin:14px 0}.zone{display:flex;align-items:flex-end;justify-content:center;padding:10px 2px;border:0;border-right:1px solid #303a3c;border-radius:0;background:#19241f;color:#a4c4b1;font-size:12px;position:relative;touch-action:none}.zone:nth-child(even){background:#202a2a}.zone.root{background:#30473b;color:#d4f8df}.zone.hit{background:#78cfa2;color:#0d adding:16px}.layout{grid-template-columns:1fr}.brand small,.traffic{display:none}}@media(max-width:690px){.app{display:block}header{padding:9px;flex-wrap:wrap}.brand{font-size:12px}.brand .logo{display:none}header .pill{display:none}header button{font-size:11px;padding:7px}aside{display:flex;flex-direction:row;overflow:auto;border-right:0;padding:6px;gap:4px}.nav{white-space:nowrap;padding:8px}.section,.bottom{display:none}main{padding:12px}.intro{align-items:flex-start;flex-wrap:wrap}h1{font-size:22px}.fields{grid-template-columns:1fr 1fr}.devicegrid,.tilegrid,.routegrid{grid-template-columns:1fr}.surface{height:190px}.footer{position:static;padding:10px;flex-wrap:wrap}.matrix{grid-template-columns:65px repeat(16,23px)}.pad{min-height:70px}.card{padding:13px}}
</style><style>
.app{grid-template-columns:235px minmax(0,1fr)}aside{position:sticky;top:70px;max-height:calc(100vh - 112px);overflow:auto;align-self:start}.nav{font-size:12px}.nav[aria-current=true]{font-weight:650}.casegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.case{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:10px;min-width:0}.case p{color:var(--muted);font-size:12px;flex:1}.case h3{font-size:15px}.case .bar button{font-size:12px}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:15px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}.stat strong{font-size:24px;display:block;margin-top:5px;letter-spacing:-.6px}.tag{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:4px 7px;color:var(--muted);display:inline-block}.tag.good{color:#98d6b1;border-color:#486554}.tag.warn{color:#efbc83;border-color:#735c43}.tag.bad{color:#ff9da1;border-color:#794c52}.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}.subtabs button{padding:8px 12px}.tablewrap{overflow:auto}.data{border-collapse:collapse;width:100%;font-size:12px;text-align:left;white-space:nowrap}.data td,.data th{border-bottom:1px solid var(--line);padding:10px 8px}.data th{color:var(--muted);font-size:10px;font-weight:650;letter-spacing:.4px}.data td button{font-size:11px;padding:6px 8px}.data td input,.data td select{font-size:11px;max-width:175px;padding:6px}.tablewrap tr:last-child td{border:0}.tiny{font-size:11px;padding:6px 9px}.timeline{border-left:1px solid #535f59;margin-left:8px;padding-left:15px;display:grid;gap:12px}.timeline>div{position:relative}.timeline>div:before{content:"";position:absolute;left:-20px;top:4px;width:8px;height:8px;border-radius:100%;background:#a4d6b8}.timeline small{display:block}.casehero{background:linear-gradient(120deg,#24382f,#252b36);border:1px solid #475f53;padding:20px;border-radius:12px;margin:0 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#eef6f0}.casehero p{color:#b3c8bb;margin-top:6px}.pairflow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}.pairflow div{border:1px solid var(--line);border-radius:8px;padding:11px;font-size:12px}.pairflow .done{border-color:#5b9672;color:#97d9af}.pairflow .current{border-color:#e3b37b;color:#efbe87}.remotephone{max-width:340px;margin:auto;border:6px solid #454b54;border-radius:24px;background:#14171b;color:#e9edf1;padding:15px;box-shadow:0 8px 28px #0003}.remotephone .padgrid{grid-template-columns:repeat(4,1fr);gap:5px}.remotephone .pad{min-height:55px;font-size:11px;padding:5px}.remotephone .surface{height:160px}.remotephone .keyboard{height:85px}.phonebar{display:flex;justify-content:space-between;font-size:10px;margin-bottom:18px;color:#aeb9b1}.remotephone .subtabs button{font-size:11px;padding:6px}.fieldstack{display:grid;gap:10px}.fieldstack input,.fieldstack select{width:100%;min-width:0}.inlineform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.inlineform input{min-width:0;flex:1}.alert{border:1px solid #70444b;background:#38242a;color:#ffb9bd;border-radius:8px;padding:12px;font-size:12px;line-height:1.5}.light .tag.good{color:#24643c}.light .tag.warn{color:#8c5118}.light .tag.bad{color:#a92f38}.light .remotephone{color:#e9edf1}.light .casehero{color:#edf6ee}.light .casehero .muted{color:#c1d3c7}.light .timeline{border-color:#9faea5}.light .pairflow .done{color:#28663e}.light .pairflow .current{color:#8c5118}@media(max-width:1100px){.casegrid{grid-template-columns:repeat(2,1fr)}.statgrid{grid-template-columns:repeat(2,1fr)}.app{grid-template-columns:185px minmax(0,1fr)}}@media(max-width:690px){.app{display:block}aside{position:static;max-height:none;overflow:auto}.casegrid,.statgrid{grid-template-columns:1fr 1fr}.pairflow{grid-template-columns:repeat(2,1fr)}.casehero{padding:14px}}
</style></head><body><div class="app" id="app"><header><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand"><div class="logo">∿</div><div>TIHULU <small style="display:block;font-weight:400">Trackpad &amp; M. Mouse Instrument</small></div></div><span class="pill">UI CONCEPT · NOT LIVE</span><div class="spacer"></div><button id="capture" class="quiet" title="Simulated only">Capture off</button><button id="release" class="quiet">Release my controls</button><button id="panic" class="danger">■ Panic Stop · Esc</button></header><aside id="nav"></aside><main id="main"></main><footer class="footer"><span><i class="dot green" style="display:inline-block"></i> Offline demo</span><span id="status" role="status" aria-live="polite">Ready · all outputs off</span><span class="spacer"></span><span>No hardware access · no MIDI · no network</span></footer></div>
<script>
"use strict";
const $=s=>document.querySelector(s), nav=$("#nav"), main=$("#main"), status=$("#status");
const sections=[["PERFORM",["touch","◉","Touch Instrument"],["groups","▦","Instrument Groups"],["helper","≋","MIDI Helper"],["drums","▧","Drum Pads"],["seq","▤","Sequencers"]],["CREATE",["builder","⌘","Instrument Builder"],["voice","◌","Voice"],["audio","∿","Audio & Speaker"]],["CONNECT",["remote","⌁","Party Jam / Remote"],["gamepad","⊕","Gamepad & Pedals"]],["SYSTEM",["settings","⚙","Settings"],["diag","≡","Diagnostics"]]];
let sliderValues={},modeSessions=new Set(),page="touch",playing=false,capture=false,theme=false,stepState=new Set([0,4,8,12,20,28,34,38,42,46,48,56]),toggles={},choices={},groupArmed=false,events=[];
const notes=["C3","D3","E3","F3","G3","A3","B3","C4"], labels=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B","C"];
const log=t=>{status.textContent=t;events.unshift(t);events=events.slice(0,10)};
const title=(a,b,c="")=>'<div class="intro"><div><div class="eyebrow">PERFORMANCE STUDIO / '+a.toUpperCase()+'</div><h1>'+a+'</h1><p>'+b+'</p></div><div class="spacer"></div>'+c+'</div>';
const card=(h,body,extra="")=>'<section class="card"><div class="cardhead"><h2>'+h+'</h2><div class="spacer"></div>'+extra+'</div>'+body+'</section>';
const select=(l,arr)=>'<label><span class="label">'+l+'</span><select data-choice="'+l+'">'+arr.map(x=>'<option'+((choices[page+":"+l]||arr[0])===x?' selected':'')+'>'+x+'</option>').join("")+'</select></label>';
const toggle=(name,desc="")=>'<div class="line"><div><h3>'+name+'</h3><small>'+desc+'</small></div><button class="switch '+(toggles[name]?"active":"")+'" data-toggle="'+name+'" aria-pressed="'+!!toggles[name]+'">'+(toggles[name]?"On":"Off")+'</button></div>';
const slider=(l,v)=>{v=sliderValues[page+":"+l]??v;return '<label><span class="label">'+l+' <output>'+v+'%</output></span><input type="range" value="'+v+'" min="0" max="100" data-slider data-slider-key="'+page+":"+l+'"></label>'};
const device=(h,d,s)=>'<div class="device"><div class="bar"><h3>'+h+'</h3><div class="spacer"></div><span class="pill">'+s+'</span></div><p>'+d+'</p></div>';
const surface=()=>'<div class="surface" aria-label="Illustrative touch surface">'+notes.map((n,i)=>'<button class="zone '+(i===0||i===7?'root':'')+'" data-note="'+n+'">'+n+'</button>').join("")+'</div><div class="bar"><small>X · pitch / note zones</small><div class="spacer"></div><small>Contact size · illustrative only</small></div>';
const keyboard=()=>'<div class="keyboard">'+labels.map(n=>'<button class="key '+(n.includes("♯")?"black":"")+'" data-note="'+n+'3">'+n+'</button>').join("")+'</div>';
const start=()=>'<button class="primary" data-action="start">'+(playing?'■ Stop preview':'▶ Start preview')+'</button>';
const state=()=>'<span class="pill"><i class="dot '+(playing?'green':'')+'"></i> '+(playing?'Simulated active':'Inactive')+'</span>';
const route=()=>'<div class="fields">'+select("Output",["MIDI Instrument","Haptic","Both"])+select("MIDI mode",["MPE","Standard MIDI","GM Drums"])+select("Channel",["1","2","10","16"])+'</div>';
const expression=()=>toggle("Vibrato","Contact / position")+toggle("Pitch bend","Horizontal movement")+toggle("Expression","CC11 · vertical movement")+toggle("Sustain","CC64 · hold / toggle");
const screens={
touch:()=>title("Touch Instrument","Play expressive notes with your Mac trackpad or Magic Mouse.",start())+'<div class="layout"><div>'+card("Live surface",'<div class="fields">'+select("Surface",["Trackpad","Magic Mouse","Both"])+select("Mode",["Fretted","Fretless","Chords","Drums"])+select("Scale",["C major","A minor","D Dorian","Chromatic"])+'</div>'+surface()+keyboard()+'<div class="fields">'+select("Root",["C","D","E","F","G","A","B"])+select("Note trigger",["Touch hold","Click hold","Tap toggle","Contact threshold"])+select("Velocity",["Fixed","Contact size"])+'</div><div class="sliders">'+slider("Zone width",50)+slider("Sensitivity",68)+'</div>',state())+card("Connected surfaces",'<div class="devicegrid">'+device("Trackpad","Melodic · MPE · Logic MIDI","DEMO")+device("Magic Mouse","Independent mapping · idle","DEMO")+'</div>')+'</div><div>'+card("MIDI & output",route()+'<div class="line"><span>Virtual source</span><strong>TIHULU MIDI</strong></div><div class="line"><span>Active notes</span><strong id="noteCount">0</strong></div><div class="line"><span>Output state</span><small>Simulated / disconnected</small></div>')+card("Expression",expression()+select("Sustain mode",["Touch hold","Tap toggle","Click hold","Click toggle","Contact threshold"]))+card("Safety",'<div class="notice">All real outputs are off. Capture and Panic Stop here only affect the preview. No system permissions are requested.</div>')+'</div></div>',
groups:()=>title("Instrument Groups","Build a multi-surface performance rig. Each instrument starts off.",'<button class="primary" data-action="arm">Preview group '+(groupArmed?'off':'on')+'</button>')+'<div class="layout"><div>'+card("Performance layout",'<div class="tilegrid">'+["Lead • Trackpad","Bass • Magic Mouse","Drums • Gamepad","Chord pad • Tablet"].map((n,i)=>'<div class="device"><h3>'+n+'</h3><p>'+["MPE · melodic","MIDI · bass","GM channel 10","Remote · chord zones"][i]+'</p>'+toggle(n,"Mapped · available in demo")+'</div>').join("")+'</div>')+card("Group routing",'<div class="routegrid"><div class="node">Inputs<p>4 logical sources</p></div><div class="node">Ownership<p>Independent note gates</p></div><div class="node">Destinations<p>MIDI / MPE / haptic</p></div></div>')+'</div><div>'+card("Admission",'<div class="line">Mapped <b>4</b></div><div class="line">Available <b>Demo only</b></div><div class="line">Requested <b>'+(groupArmed?"Preview":"None")+'</b></div><div class="line">Acknowledged <b>None</b></div><div class="line">Actual output <b>OFF</b></div><div class="notice">Real group activation requires admission and neutral input. This UI never claims a hardware acknowledgement.</div>')+card("Pinned controls",toggle("Group sustain","Hold / toggle")+toggle("Group expression","Independent motion"))+'</div></div>',
helper:()=>title("MIDI Helper","Add expressive controls while playing a separate MIDI keyboard.",start())+'<div class="layout"><div>'+card("Controller surface",'<div class="fields">'+select("Surface",["Both","Trackpad","Magic Mouse"])+select("MIDI channel",["1","2","10","16"])+select("Target",["Logic Pro","Virtual MIDI"])+'</div>'+surface())+card("Live values",'<div class="sliders">'+slider("CC1 · modulation",25)+slider("CC11 · expression",65)+slider("Pitch bend",50)+slider("CC7 · volume",80)+'</div>')+'</div><div>'+card("Independent mappings",expression())+card("Pedal mapping",select("Trigger",["Touch hold","Tap toggle","Click hold","Click toggle"])+toggle("Polarity invert"))+'</div></div>',

const wireTable=()=>wire.length?table(["TICK","SOURCE","SIGNAL","TARGET","VALUE","DISPOSITION"],wire.slice(0,35).map(w=>[w.tick,esc(w.source),esc(w.signal),esc(w.target),esc(w.value),tag(w.disposition,w.disposition.startsWith("Rejected")?"warn":"")])):'<p class="muted">No simulated commands. Arm a source and operate its controls.</p>';
const activeModeRow=()=>activeModes().length?'<div class="livebar">'+activeModes().map((n,i)=>'<span>'+esc(n)+' '+btn("modeStop:"+[...modeSessions][i],"Stop")+'</span>').join("")+'</div>':'<p class="muted">No preview mode running.</p>';
function clearConsole(id){for(const [key,val] of consoleHeld){if(!id||val.id===id){addWire(val.id,val.signal,val.target,0,"Scoped cleanup (mock)");consoleHeld.delete(key)}}for(const k of [...consoleSustain])if(!id||k.startsWith(id+":"))consoleSustain.delete(k);for(const k of [...consoleLast.keys()])if(!id||k.startsWith(id+":"))consoleLast.delete(k)}
function tryCommand(id,signal,value,age=0){let d=S.devices[id];if(!d?.armed||S.panic||S.debt){addWire(id,signal,"—",value,"Rejected: not armed");return false}let limit=id==="tp"||id==="mm"?150:id==="cam"?250:350;if(age>=limit){clearConsole(id);release(id);addWire(id,signal,"—",value,"Rejected: stale");trace("Mock stale "+sourceName(id)+" retired; other owners retained","HOLD");return false}let routes=S.routes.filter(x=>x.source===id&&x.signal===signal);if(!routes.length){addWire(id,signal,"Unmapped",value,"Rejected: no route");return false}for(const route of routes){let key=id+":"+route.channel+":"+route.target;let target="CH "+route.channel+" · "+route.target;let isNote=/^(Note|Chord)/.test(route.target),isPedal=/^CC64/.test(route.target);if(isNote){if(value>0){if(consoleHeld.has(key))continue;consoleHeld.set(key,{id,signal,target,down:true});addWire(id,signal,target,value)}else if(consoleHeld.has(key)){let n=consoleHeld.get(key);n.down=false;if(!consoleSustain.has(id+":"+route.channel)){consoleHeld.delete(key);addWire(id,signal,target,0)}else addWire(id,signal,target,0,"Held by sustain (mock)")}}else if(isPedal){let ped=id+":"+route.channel;if(value>=64)consoleSustain.add(ped);else{consoleSustain.delete(ped);for(const [k,n] of consoleHeld){if(k.startsWith(ped+":")&&!n.down){consoleHeld.delete(k);addWire(id,signal,n.target,0,"Sustain release (mock)")}}}addWire(id,signal,target,value>=64?127:0)}else{if(consoleLast.get(key)===value)continue;consoleLast.set(key,value);addWire(id,signal,target,value)}}return true}
const prevRelease=release; // release is const in original; explicit cleanup is applied from new console controls
function persist(){if(!localEnabled)return;try{localStorage.setItem(archiveKey,JSON.stringify({version:3,saved:S.saved}));archiveNotice="Saved to this browser only"}catch(e){archiveNotice="Browser storage unavailable; using session memory";localEnabled=false}}
function readArchive(){try{let raw=localStorage.getItem(archiveKey);if(!raw){archiveNotice="No browser archive found";return}let obj=JSON.parse(raw);if(obj.version!==3||!Array.isArray(obj.saved)||obj.saved.length>60)throw Error("Invalid archive");let valid=obj.saved.every(w=>typeof w.name==="string"&&Array.isArray(w.sources)&&w.sources.every(id=>S.devices[id])&&Array.isArray(w.groups)&&w.groups.length<=64&&w.groups.every(g=>typeof g.name==="string"&&typeof g.id==="string"&&S.devices[g.source]&&Number.isInteger(g.channel)&&g.channel>=1&&g.channel<=16)&&Array.isArray(w.routes)&&w.routes.length<=64&&w.routes.every(q=>S.devices[q.source]&&typeof q.signal==="string"&&typeof q.target==="string"&&typeof q.label==="string"&&Number(q.channel)>=1&&Number(q.channel)<=16)&& (w.profile===null||Number.isInteger(w.profile)&&w.profile>=0&&w.profile<presets.length));if(!valid)throw Error("Invalid workspace records");S.saved=obj.saved.map(w=>({...w,groups:w.groups.map(g=>({...g,active:false,muted:false}))}));archiveNotice=S.saved.length+" archived draft(s) loaded";localEnabled=true}catch(e){archiveNotice="Archive unavailable or invalid; current drafts preserved"}}
const priorProfiles=screens.profiles;
screens.profiles=()=>priorProfiles()+'<div class="wide">'+card("Browser archive · opt-in",'<div class="line"><div><h3>Save drafts on this browser</h3><small>Only workspace configurations; no hardware state, no live sessions, no secrets.</small></div>'+btn("localToggle",localEnabled?"Disable archive":"Enable archive",localEnabled?"active":"tiny")+'</div><div class="bar">'+btn("localRead","Read archived drafts")+btn("localWrite","Save archive now")+btn("localClear","Erase browser archive","tiny danger")+'</div><p class="muted" style="margin-top:12px">'+esc(archiveNotice||"Off by default. Enable explicitly if you want drafts to survive a reload.")+'</p>')+'</div>';
const priorHome=screens.home;screens.home=()=>priorHome()+'<div class="wide layout"><div>'+card("Independent preview sessions",activeModeRow())+card("Studio control room",'<div class="tilegrid">'+[["mixer","Group mixer","Mute, solo, pan, volume and session status"],["console","Control console","Inject signals into configured mock mappings"],["tests","Preview verification","Run local state-machine checks"]].map(([id,n,d])=>'<div class="device"><h3>'+n+'</h3><p>'+d+'</p>'+btn("open:"+id,"Open")+'</div>').join("")+'</div>')+'</div><div>'+card("Quick navigation",'<div class="line"><span>Profiles</span>'+btn("open:profiles","Prepare")+'</div><div class="line"><span>Connections</span>'+btn("open:connections","Bind")+'</div><div class="line"><span>Groups</span>'+btn("open:groups","Arm")+'</div><div class="line"><span>DAW</span>'+btn("open:daw","Verify")+'</div>')+'</div></div>';
screens.mixer=()=>title("Performance Mixer","Group-level visual mix · no DSP or actual MIDI volume output.",btn("open:groups","Edit groups"))+summaries()+card("Group channel strips",S.groups.length?'<div class="mixgrid">'+S.groups.map((g,i)=>{let m=mixFor(g);let audible=g.active&&!g.muted&&(!S.groups.some(x=>mixFor(x).solo)||m.solo);return '<div class="strip"><div class="bar">'+tag(g.active?"Armed (mock)":"Inactive",g.active?"good":"")+'<div class="spacer"></div><small>CH '+g.channel+'</small></div><h3>'+esc(g.name)+'</h3><small>'+esc(sourceName(g.source))+' · '+esc(g.id)+'</small><div class="fader"><div class="led"><i style="height:'+(audible?m.volume:0)+'%"></i></div><input type="range" min="0" max="127" value="'+m.volume+'" data-mix="'+i+':volume" aria-label="Group volume"><b>'+m.volume+'</b></div><label class="pan"><span class="label">Pan '+m.pan+'</span><input type="range" min="0" max="127" value="'+m.pan+'" data-mix="'+i+':pan"></label><div class="bar">'+btn("gmute:"+i,g.muted?"Unmute":"Mute",g.muted?"tiny active":"tiny")+btn("mixSolo:"+i,"Solo",m.solo?"tiny active":"tiny")+'</div><div class="bar">'+btn("gstart:"+i,"Arm")+btn("gstop:"+i,"Stop")+'</div></div>'}).join("")+'</div>':'<p class="muted">Prepare a profile or add groups to display channels.</p>'+btn("open:profiles","Prepare profile"))+'<div class="wide layout"><div>'+card("Monitor projection",groupTable())+'</div><div>'+card("Master control",'<div class="sliders">'+slider("Master level",70)+slider("Preview haptic level",25)+'</div><div class="bar">'+btn("releaseAll","Release all")+btn("closePorts","Close ports")+'</div><div class="notice">Meters represent mock control values only, not audio signal levels.</div>')+'</div></div>';
screens.console=()=>{let d=S.devices[consoleSource];let routes=S.routes.filter(x=>x.source===consoleSource);return title("Live Control Console","Drive the mock state model from mapped source signals. No transport or sound.",btn("clearWire","Clear monitor"))+summaries()+'<div class="layout"><div>'+card("Source playground",'<div class="fields"><label><span class="label">Source</span><select id="consoleSource">'+definitions.map(([id,n])=>'<option value="'+id+'" '+(id===consoleSource?"selected":"")+'>'+esc(n)+'</option>').join("")+'</select></label><label><span class="label">Signal</span><select id="consoleSignal">'+[...new Set(["X","Y","Contact","Button A","Button B","Pedal sustain","Tilt roll","Angle",...routes.map(x=>x.signal)])].map(x=>'<option '+(x===consoleSignal?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select></label><label><span class="label">Value 0–127</span><input id="consoleValue" type="number" min="0" max="127" value="'+consoleValue+'"></label></div><div class="statusrow">'+tag(d.mapped?"Mapped":"Unmapped")+tag(d.connected?"Connected":"Disconnected")+tag(d.armed?"Armed":"Inactive",d.armed?"good":"")+'</div><div class="bar">'+btn("map:"+consoleSource,d.mapped?"Unmap":"Map")+btn("connect:"+consoleSource,"Connect")+btn("arm:"+consoleSource,"Arm")+btn("release:"+consoleSource,"Release")+'</div><div class="sourcekeys" style="margin-top:15px">'+btn("sendSignal","Send value","primary")+btn("sendHigh","Send 127")+btn("sendLow","Send 0")+btn("sendStale","Inject stale frame","danger")+'</div><div class="notice" style="margin-top:14px">Commands require an armed source and matching route. Repeated note onsets and unchanged continuous values are coalesced in this illustrative model.</div>')+card("Mappings for selected source",routes.length?table(["SIGNAL","TARGET","CHANNEL","RELEASE"],routes.map(x=>[esc(x.signal),esc(x.target),esc(x.channel),esc(x.release)])):'<p class="muted">No mappings for this source.</p>'+btn("open:builder","Create routes"))+'</div><div>'+card("Mock held owners",'<div class="line">Note owners <b>'+consoleHeld.size+'</b></div><div class="line">Sustain gates <b>'+consoleSustain.size+'</b></div>'+table(["SOURCE","TARGET","CONTACT"],[...consoleHeld.values()].map(n=>[sourceName(n.id),esc(n.target),n.down?"Down":"Released / sustained"]))+btn("consoleRelease","Retire source owners"))+card("Quick routes (draft only)",btn("consoleNoteRoute","Contact → Note 60")+" "+btn("consolePedalRoute","Pedal → CC64")+" "+btn("consoleCCRoute","X → CC11"))+'</div></div><div class="wide">'+card("Wire command monitor (fictional)",wireTable())+'</div>'};
screens.tests=()=>title("Preview Verification","Deterministic browser state checks, not native CI or physical acceptance.",btn("runChecks","Run UI checks","primary"))+card("Checks",runChecks.length?table(["CHECK","RESULT","DETAIL"],runChecks.map(x=>[esc(x.name),tag(x.ok?"PASS":"FAIL",x.ok?"good":"bad"),esc(x.detail)])):'<p class="muted">Run checks against the isolated UI state model. Active workspace state is restored afterwards.</p>')+'<div class="wide">'+card("Scope",'<div class="notice">These checks exercise pure simulated state transitions only. They do not test SwiftUI, CoreMIDI, event taps, actual network, haptics or audio.</div>')+'</div>';
sections[0].push(["mixer","▥","Performance Mixer"]);sections[2].push(["console","⌁","Live Control Console"]);sections[5].push(["tests","✓","Preview Verification"]);
const runUI=()=>{let snapshot=clone(S),snapshotModes=[...modeSessions],c=clone(choices),sv=clone(sliderValues),tog=clone(toggles),sp=page,cap=capture,pl=playing,ga=groupArmed,st=status.textContent,ev=[...events],w=wire.slice(),heldCopy=new Map(consoleHeld),susCopy=new Set(consoleSustain),lastCopy=new Map(consoleLast),clock=monoClock;let checks=[];const ck=(n,fn)=>{try{let ok=!!fn();checks.push({name:n,ok,detail:ok?"Expected transition observed":"Unexpected state"})}catch(e){checks.push({name:n,ok:false,detail:String(e)})}};try{
for(let i=0;i<scenarios.length;i++)ck("Scenario "+(i+1)+" · "+scenarios[i][0],()=>{startCase(i);for(let j=1;j<scenarios[i][2].length;j++)nextCase();return S.caseStep===scenarios[i][2].length});
ck("Repeated connection preserves held note",()=>{fresh();applyPreset(1);connectId("tp");armId("tp");pressId("tp");connectId("tp");return S.devices.tp.notes===1&&!S.devices.tp.neutral});
ck("Inactive session cannot replace profile",()=>{fresh();applyPreset(1);modeSessions.add("touch");applyPreset(4);return S.profile===1});
ck("Release retains reservation",()=>{fresh();applyPreset(7);connectId("ph1");armId("ph1");release("ph1");return S.devices.ph1.reserved&&!S.devices.ph1.armed});
ck("Disconnect removes only peer",()=>{fresh();applyPreset(7);connectId("ph1");connectId("ta1");armId("ph1");armId("ta1");disconnectId("ph1");return !S.devices.ph1.reserved&&S.devices.ta1.armed});
ck("Panic blocks rearm",()=>{fresh();applyPreset(1);connectId("tp");armId("tp");panicSim();armId("tp");return S.panic&&!S.devices.tp.armed});
ck("Console rejects unmapped signal",()=>{fresh();applyPreset(1);connectId("tp");armId("tp");return !tryCommand("tp","NoSuchSignal",127)});
ck("Console note deduplicates and releases",()=>{fresh();clearConsole();applyPreset(1);connectId("tp");armId("tp");tryCommand("tp","Contact",127);tryCommand("tp","Contact",127);let n=consoleHeld.size;tryCommand("tp","Contact",0);return n===1&&consoleHeld.size===0});
ck("Console sustain retains then releases gate",()=>{fresh();clearConsole();applyPreset(1);S.routes.push({source:"tp",signal:"Pedal sustain",target:"CC64 Sustain",channel:1});connectId("tp");armId("tp");tryCommand("tp","Contact",100);tryCommand("tp","Pedal sustain",127);tryCommand("tp","Contact",0);let n=consoleHeld.size;tryCommand("tp","Pedal sustain",0);return n===1&&consoleHeld.size===0});
ck("Stale input rejects and scopes cleanup",()=>{fresh();clearConsole();applyPreset(2);connectId("tp");connectId("mm");armId("tp");armId("mm");tryCommand("tp","Contact",127);let accepted=tryCommand("tp","Contact",127,150);return !accepted&&!S.devices.tp.armed&&S.devices.mm.armed&&consoleHeld.size===0});
ck("All screen renderers generate markup",()=>Object.values(screens).every(fn=>fn().length>0));
}finally{S=snapshot;modeSessions=new Set(snapshotModes);choices=c;sliderValues=sv;toggles=tog;page=sp;capture=cap;playing=pl;groupArmed=ga;status.textContent=st;events=ev;wire=w;consoleHeld=heldCopy;consoleSustain=susCopy;consoleLast=lastCopy;monoClock=clock}runChecks=checks;return checks};
document.addEventListener("change",e=>{let t=e.target;if(t.id==="consoleSource"){consoleSource=t.value;render()}else if(t.id==="consoleSignal"){consoleSignal=t.value;render()}else if(t.id==="consoleValue"){consoleValue=Math.max(0,Math.min(127,Math.round(Number(t.value)||0)));t.value=consoleValue}else if(t.dataset.mix){let [i,k]=t.dataset.mix.split(":");mixFor(S.groups[+i])[k]=Math.max(0,Math.min(127,Number(t.value)));render()}});
document.addEventListener("click",e=>{let b=e.target.closest("[data-sim]");if(!b)return;let [a,v]=b.dataset.sim.split(":");if(["profile","case","resetCase","restartCase","loadProfile"].includes(a)){/* cleanup only after original handler has accepted replacement; handled below */}if(["release","disconnect"].includes(a))clearConsole(v);if(["releaseAll","faultDebt"].includes(a))clearConsole();if(a==="gstop"||a==="gmute"){let g=S.groups[+v];if(g&&!S.groups.some(x=>x.id!==g.id&&x.source===g.source&&x.active))clearConsole(g.source)}if(["profile","case","resetCase","restartCase","loadProfile"].includes(a)&&!armed()&&!S.ports&&!S.debt){clearConsole();mix={}}if(["saveProfile","deleteProfile"].includes(a)){queueMicrotask(()=>{persist();render()});return}
let handled=true;switch(a){case"modeStop":modeSessions.delete(v);trace("Preview mode stopped: "+v);break;case"localToggle":localEnabled=!localEnabled;if(localEnabled)persist();else archiveNotice="Browser archive disabled; existing archive retained until erased";break;case"localRead":readArchive();break;case"localWrite":if(!localEnabled){archiveNotice="Enable browser archive first";break}persist();break;case"localClear":try{localStorage.removeItem(archiveKey);archiveNotice="Browser archive erased; current session retained";localEnabled=false}catch(e){archiveNotice="Browser storage unavailable"}break;case"mixSolo":{let m=mixFor(S.groups[+v]);m.solo=!m.solo;break}case"clearWire":wire=[];break;case"sendSignal":case"sendHigh":case"sendLow":case"sendStale":tryCommand(consoleSource,consoleSignal,a==="sendHigh"?127:a==="sendLow"?0:consoleValue,a==="sendStale"?999:0);break;case"consoleRelease":clearConsole(consoleSource);release(consoleSource);trace("Mock console owners retired");break;case"consoleNoteRoute":case"consolePedalRoute":case"consoleCCRoute":if(S.ports||S.debt||armed()||modeSessions.size||held()||S.routes.length>=64){trace("Stop sessions and ensure mapping capacity first","HOLD");break}{let q={source:consoleSource,signal:a==="consoleNoteRoute"?"Contact":a==="consolePedalRoute"?"Pedal sustain":"X",target:a==="consoleNoteRoute"?"Note 60":a==="consolePedalRoute"?"CC64 Sustain":"CC11 Expression",channel:1,release:"0",label:"Console example"};if(S.routes.some(x=>x.source===q.source&&x.signal===q.signal&&x.target===q.target)){trace("Example route already exists","HOLD");break}S.routes.push(q);S.devices[consoleSource].mapped=true;S.draft=true;trace("Draft route inserted")};break;case"runChecks":runUI();break;default:handled=false}
if(handled){e.preventDefault();e.stopPropagation();render()}},true);
const stopBefore=stop;stop=function(msg){clearConsole();stopBefore(msg)};
const panicBefore=panicSim;panicSim=function(){clearConsole();panicBefore()};
const renderBefore=render;render=function(){renderBefore();nav.querySelectorAll?.("[data-page]").forEach(b=>{if(modeSessions.has(b.dataset.page)){let dot=document.createElement("span");dot.className="activitydot";dot.setAttribute("aria-label","Preview active");b.appendChild(dot)}})};
render();
</script></body></html>
