<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIHULU — Performance Studio / UI concept</title><style>
:root{color-scheme:dark;--bg:#111317;--panel:#1b1e24;--line:#30343d;--muted:#a2a9b5;--accent:#9fdfc0;--purple:#b2a7fa;--warn:#f1b37a;--red:#ff8e90}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#edf0f4;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,select,input,textarea{color:inherit;background:#242832;border:1px solid #383e49;border-radius:8px;padding:9px 12px}button{cursor:pointer}button:hover{border-color:#9fdfc0}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.active,.primary{background:#b5efd0;color:#14251c;border-color:#b5efd0;font-weight:650}.danger{background:#45272d;color:#ffb9bb;border-color:#74424a}.quiet{background:transparent}small,.muted{color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:26px;letter-spacing:-.7px}h2{font-size:16px}h3{font-size:13px}p{line-height:1.5}.app{min-height:100vh;display:grid;grid-template-columns:216px minmax(0,1fr);grid-template-rows:70px 1fr 42px;background:var(--bg)}header{grid-column:1/-1;background:#191c21;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 20px;position:sticky;top:0;z-index:3}.traffic{display:flex;gap:6px}.traffic i{width:10px;height:10px;border-radius:50%;background:#fc6667}.traffic i:nth-child(2){background:#eeb846}.traffic i:nth-child(3){background:#5fcf80}.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}.logo{display:grid;place-items:center;width:32px;height:32px;background:#293b36;border:1px solid #4d7864;border-radius:9px;color:var(--accent);font-size:20px}.spacer{flex:1}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#24272e;padding:6px 9px;border-radius:7px;font-size:11px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:100%;background:#a1a9b2}.dot.green{background:#86d9ac}.dot.orange{background:#f1b37a}aside{border-right:1px solid var(--line);padding:18px 11px;background:#16191e;display:flex;flex-direction:column;gap:6px}.section{font-size:10px;color:#8c95a3;font-weight:700;letter-spacing:1.3px;padding:15px 11px 4px}.nav{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:1px solid transparent;padding:10px;font-size:13px;color:#c0c6cf}.nav span{width:20px;text-align:center;font-size:16px}.nav[aria-current=true]{background:#293a34;border-color:#3d554a;color:#c6f2d7}.bottom{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px}main{padding:24px;min-width:0;max-width:1800px;width:100%;margin:auto;align-self:start}.intro{display:flex;gap:12px;align-items:center;margin-bottom:20px}.intro p{margin-top:5px;color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--accent);font-weight:700;margin-bottom:8px}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(250px,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;min-width:0}.card+.card{margin-top:13px}.layout>.card+.card{margin:0}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}.label{font-size:11px;color:var(--muted);display:block;margin-bottom:7px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}.fields select{width:100%;min-width:0}.surface{height:230px;border-radius:15px;background:#12161b;border:1px solid #414b53;display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;position:relative;margin:14px 0}.zone{display:flex;align-items:flex-end;justify-content:center;padding:10px 2px;border:0;border-right:1px solid #303a3c;border-radius:0;background:#19241f;color:#a4c4b1;font-size:12px;position:relative;touch-action:none}.zone:nth-child(even){background:#202a2a}.zone.root{background:#30473b;color:#d4f8df}.zone.hit{background:#78cfa2;color:#0d2416}.zone.hit:before{content:"";position:absolute;top:36%;left:calc(50% - 13px);width:26px;height:26px;border:2px solid #e4ffec;border-radius:50%;box-shadow:0 0 18px #b0f9ce}.surface:after{content:"Y · EXPRESSION";position:absolute;top:10px;left:10px;font-size:9px;letter-spacing:1px;color:#a9b5ae;pointer-events:none}.keyboard{display:flex;height:67px;margin:12px 0 4px;gap:3px}.key{flex:1;border-radius:0 0 5px 5px;border:0;background:#dedfe2;color:#30343b;padding:0 1px 6px;display:flex;align-items:flex-end;justify-content:center;font-size:10px}.key.black{background:#30333a;color:#d3d5d9;height:70%}.key.hit{background:#9fdfc0;color:#183a28}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}.switch{min-width:46px;font-size:11px;padding:5px 8px}.meter{height:5px;border-radius:9px;background:#333944;overflow:hidden;margin-top:7px}.meter i{height:100%;display:block;background:var(--accent);border-radius:9px}.devicegrid,.tilegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.device{border:1px solid var(--line);border-radius:10px;padding:14px;background:#181b20;min-width:0}.device p{font-size:12px;color:var(--muted);margin:6px 0 12px}.device h3{font-size:14px}.wide{margin-top:14px}.matrix{display:grid;grid-template-columns:78px repeat(16,minmax(16px,1fr));gap:4px;align-items:center;overflow:auto}.step{aspect-ratio:1;border-radius:5px;padding:0;min-width:16px;background:#292d35}.step.on{background:#9fdfc0;border-color:#b0e9c9}.step:nth-child(4n+2){border-left-color:#87938f}.padgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pad{min-height:95px;background:#2b263b;border-color:#494260;color:#ded5ff;text-align:left;font-weight:650}.pad.hit{background:#b2a7fa;color:#201b39}.pad small{display:block;margin-top:8px}.routegrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:stretch}.node{padding:16px;border:1px solid #465a50;background:#242f2a;border-radius:10px}.node:nth-child(2){background:#2e293b;border-color:#4a4264}.node:nth-child(3){background:#262c38;border-color:#3d4c69}.node p{font-size:12px;margin-top:10px;color:#b3bbc4}.sliders{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.sliders input{width:100%;accent-color:var(--accent);padding:0}.wave{display:flex;height:105px;align-items:center;gap:3px;overflow:hidden;margin:18px 0}.wave i{flex:1;background:#8bc5a8;border-radius:2px;min-width:2px;opacity:.75}.drop{border:1px dashed #64766c;border-radius:10px;text-align:center;padding:35px 12px;color:var(--muted)}.notice{border:1px solid #594b35;border-radius:8px;padding:12px;color:#f1c996;background:#2c261c;font-size:12px;line-height:1.5}.footer{grid-column:1/-1;display:flex;align-items:center;padding:0 18px;gap:14px;border-top:1px solid var(--line);background:#16191e;color:#a6aeb8;font-size:11px;position:sticky;bottom:0;z-index:2}.footer #status{color:#c8e9d5}.hide{display:none!important}textarea{width:100%;min-height:120px;resize:vertical}.log{font:12px ui-monospace,monospace;color:#b2c5bb;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.preset{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:13px 0}.preset:last-child{border:0}.light{--bg:#edf0f3;--panel:#fff;--line:#d4d9df;--muted:#596271;color-scheme:light;background:#e5e8ec;color:#202831}.light header,.light aside,.light .footer{background:#f4f6f8;color:#46515e}.light .device{background:#f3f6f7}.light .nav{color:#53616e}.light .nav[aria-current=true]{color:#244c36;background:#d7ebde}.light .section{color:#596271}.light .pill,.light button:not(.primary):not(.danger):not(.active):not(.nav):not(.zone):not(.key):not(.pad):not(.step),.light select,.light textarea{background:#e4e9ee;color:#34404d}.light .eyebrow{color:#367551}.light .footer #status{color:#276a46}@media(max-width:1000px){.app{grid-template-columns:175px minmax(0,1fr)}main{padding:16px}.layout{grid-template-columns:1fr}.brand small,.traffic{display:none}}@media(max-width:690px){.app{display:block}header{padding:9px;flex-wrap:wrap}.brand{font-size:12px}.brand .logo{display:none}header .pill{display:none}header button{font-size:11px;padding:7px}aside{display:flex;flex-direction:row;overflow:auto;border-right:0;padding:6px;gap:4px}.nav{white-space:nowrap;padding:8px}.section,.bottom{display:none}main{padding:12px}.intro{align-items:flex-start;flex-wrap:wrap}h1{font-size:22px}.fields{grid-template-columns:1fr 1fr}.devicegrid,.tilegrid,.routegrid{grid-template-columns:1fr}.surface{height:190px}.footer{position:static;padding:10px;flex-wrap:wrap}.matrix{grid-template-columns:65px repeat(16,23px)}.pad{min-height:70px}.card{padding:13px}}
</style></head><body><div class="app" id="app"><header><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand"><div class="logo">∿</div><div>TIHULU <small style="display:block;font-weight:400">Trackpad &amp; M. Mouse Instrument</small></div></div><span class="pill">UI CONCEPT · NOT LIVE</span><div class="spacer"></div><button id="capture" class="quiet" title="Simulated only">Capture off</button><button id="release" class="quiet">Release my controls</button><button id="panic" class="danger">■ Panic Stop · Esc</button></header><aside id="nav"></aside><main id="main"></main><footer class="footer"><span><i class="dot green" style="display:inline-block"></i> Offline demo</span><span id="status" role="status" aria-live="polite">Ready · all outputs off</span><span class="spacer"></span><span>No hardware access · no MIDI · no network</span></footer></div>
<script>
"use strict";
const $=s=>document.querySelector(s), nav=$("#nav"), main=$("#main"), status=$("#status");
const sections=[["PERFORM",["touch","◉","Touch Instrument"],["groups","▦","Instrument Groups"],["helper","≋","MIDI Helper"],["drums","▧","Drum Pads"],["seq","▤","Sequencers"]],["CREATE",["builder","⌘","Instrument Builder"],["voice","◌","Voice"],["audio","∿","Audio & Speaker"]],["CONNECT",["remote","⌁","Party Jam / Remote"],["gamepad","⊕","Gamepad & Pedals"]],["SYSTEM",["settings","⚙","Settings"],["diag","≡","Diagnostics"]]];
let page="touch",playing=false,capture=false,theme=false,stepState=new Set([0,4,8,12,20,28,34,38,42,46,48,56]),toggles={},choices={},groupArmed=false,events=[];
const notes=["C3","D3","E3","F3","G3","A3","B3","C4"], labels=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B","C"];
const log=t=>{status.textContent=t;events.unshift(t);events=events.slice(0,10)};
const title=(a,b,c="")=>'<div class="intro"><div><div class="eyebrow">PERFORMANCE STUDIO / '+a.toUpperCase()+'</div><h1>'+a+'</h1><p>'+b+'</p></div><div class="spacer"></div>'+c+'</div>';
const card=(h,body,extra="")=>'<section class="card"><div class="cardhead"><h2>'+h+'</h2><div class="spacer"></div>'+extra+'</div>'+body+'</section>';
const select=(l,arr)=>'<label><span class="label">'+l+'</span><select data-choice="'+l+'">'+arr.map(x=>'<option'+((choices[l]||arr[0])===x?' selected':'')+'>'+x+'</option>').join("")+'</select></label>';
const toggle=(name,desc="")=>'<div class="line"><div><h3>'+name+'</h3><small>'+desc+'</small></div><button class="switch '+(toggles[name]?"active":"")+'" data-toggle="'+name+'" aria-pressed="'+!!toggles[name]+'">'+(toggles[name]?"On":"Off")+'</button></div>';
const slider=(l,v)=>'<label><span class="label">'+l+' <output>'+v+'%</output></span><input type="range" value="'+v+'" min="0" max="100" data-slider></label>';
const device=(h,d,s)=>'<div class="device"><div class="bar"><h3>'+h+'</h3><div class="spacer"></div><span class="pill">'+s+'</span></div><p>'+d+'</p></div>';
const surface=()=>'<div class="surface" aria-label="Illustrative touch surface">'+notes.map((n,i)=>'<button class="zone '+(i===0||i===7?'root':'')+'" data-note="'+n+'">'+n+'</button>').join("")+'</div><div class="bar"><small>X · pitch / note zones</small><div class="spacer"></div><small>Contact size · illustrative only</small></div>';
const keyboard=()=>'<div class="keyboard">'+labels.map(n=>'<button class="key '+(n.includes("♯")?"black":"")+'" data-note="'+n+'3">'+n+'</button>').join("")+'</div>';
const start=()=>'<button class="primary" data-action="start">'+(playing?'■ Stop preview':'▶ Start preview')+'</button>';
const state=()=>'<span class="pill"><i class="dot '+(playing?'green':'')+'"></i> '+(playing?'Simulated active':'Inactive')+'</span>';
const route=()=>'<div class="fields">'+select("Output",["MIDI Instrument","Haptic","Both"])+select("MIDI mode",["MPE","Standard MIDI","GM Drums"])+select("Channel",["1","2","10","16"])+'</div>';
const expression=()=>toggle("Vibrato","Contact / position")+toggle("Pitch bend","Horizontal movement")+toggle("Expression","CC11 · vertical movement")+toggle("Sustain","CC64 · hold / toggle");
const screens={
touch:()=>title("Touch Instrument","Play expressive notes with your Mac trackpad or Magic Mouse.",start())+'<div class="layout"><div>'+card("Live surface",'<div class="fields">'+select("Surface",["Trackpad","Magic Mouse","Both"])+select("Mode",["Fretted","Fretless","Chords","Drums"])+select("Scale",["C major","A minor","D Dorian","Chromatic"])+'</div>'+surface()+keyboard()+'<div class="fields">'+select("Root",["C","D","E","F","G","A","B"])+select("Note trigger",["Touch hold","Click hold","Tap toggle","Contact threshold"])+select("Velocity",["Fixed","Contact size"])+'</div><div class="sliders">'+slider("Zone width",50)+slider("Sensitivity",68)+'</div>',state())+card("Connected surfaces",'<div class="devicegrid">'+device("Trackpad","Melodic · MPE · Logic MIDI","DEMO")+device("Magic Mouse","Independent mapping · idle","DEMO")+'</div>')+'</div><div>'+card("MIDI & output",route()+'<div class="line"><span>Virtual source</span><strong>TIHULU MIDI</strong></div><div class="line"><span>Active notes</span><strong id="noteCount">0</strong></div><div class="line"><span>Output state</span><small>Simulated / disconnected</small></div>')+card("Expression",expression()+select("Sustain mode",["Touch hold","Tap toggle","Click hold","Click toggle","Contact threshold"]))+card("Safety",'<div class="notice">All real outputs are off. Capture and Panic Stop here only affect the preview. No system permissions are requested.</div>')+'</div></div>',
groups:()=>title("Instrument Groups","Build a multi-surface performance rig. Each instrument starts off.",'<button class="primary" data-action="arm">Preview group '+(groupArmed?'off':'on')+'</button>')+'<div class="layout"><div>'+card("Performance layout",'<div class="tilegrid">'+["Lead • Trackpad","Bass • Magic Mouse","Drums • Gamepad","Chord pad • Tablet"].map((n,i)=>'<div class="device"><h3>'+n+'</h3><p>'+["MPE · melodic","MIDI · bass","GM channel 10","Remote · chord zones"][i]+'</p>'+toggle(n,"Mapped · available in demo")+'</div>').join("")+'</div>')+card("Group routing",'<div class="routegrid"><div class="node">Inputs<p>4 logical sources</p></div><div class="node">Ownership<p>Independent note gates</p></div><div class="node">Destinations<p>MIDI / MPE / haptic</p></div></div>')+'</div><div>'+card("Admission",'<div class="line">Mapped <b>4</b></div><div class="line">Available <b>Demo only</b></div><div class="line">Requested <b>'+(groupArmed?"Preview":"None")+'</b></div><div class="line">Acknowledged <b>None</b></div><div class="line">Actual output <b>OFF</b></div><div class="notice">Real group activation requires admission and neutral input. This UI never claims a hardware acknowledgement.</div>')+card("Pinned controls",toggle("Group sustain","Hold / toggle")+toggle("Group expression","Independent motion"))+'</div></div>',
helper:()=>title("MIDI Helper","Add expressive controls while playing a separate MIDI keyboard.",start())+'<div class="layout"><div>'+card("Controller surface",'<div class="fields">'+select("Surface",["Both","Trackpad","Magic Mouse"])+select("MIDI channel",["1","2","10","16"])+select("Target",["Logic Pro","Virtual MIDI"])+'</div>'+surface())+card("Live values",'<div class="sliders">'+slider("CC1 · modulation",25)+slider("CC11 · expression",65)+slider("Pitch bend",50)+slider("CC7 · volume",80)+'</div>')+'</div><div>'+card("Independent mappings",expression())+card("Pedal mapping",select("Trigger",["Touch hold","Tap toggle","Click hold","Click toggle"])+toggle("Polarity invert"))+'</div></div>',
drums:()=>title("Drum Pads","GM drum mapping · MIDI channel 10.",start())+'<div class="layout"><div>'+card("4 × 4 performance pads",'<div class="padgrid">'+["Kick · 36","Snare · 38","Closed hat · 42","Open hat · 46","Low tom · 45","Mid tom · 47","High tom · 50","Crash · 49","Ride · 51","Clap · 39","Rim · 37","Cowbell · 56","Tambourine · 54","Shaker · 82","Low conga · 64","High conga · 63"].map(n=>'<button class="pad" data-note="'+n+'">'+n+'<small>CH 10</small></button>').join("")+'</div>')+'</div><div>'+card("Pad settings",select("Layout",["4 × 4","2 × 8","Custom"])+route()+toggle("Fixed velocity")+slider("Velocity",78))+'</div></div>',
seq:()=>title("Sequencers","Sketch patterns before sending them to an instrument.",start())+card("Pattern 01",'<div class="bar">'+select("Sequence type",["Drum sequence","Note sequence"])+select("Tempo",["120 BPM","90 BPM","100 BPM","140 BPM"])+select("Length",["16 steps","8 steps","32 steps"])+'</div><div class="matrix" style="margin-top:20px">'+["Kick","Snare","Hat","Clap"].map((n,row)=>'<small>'+n+'</small>'+Array.from({length:16},(_,i)=>'<button class="step '+(stepState.has(row*16+i)?"on":"")+'" data-step="'+(row*16+i)+'" aria-label="'+n+' step '+(i+1)+'" aria-pressed="'+stepState.has(row*16+i)+'"></button>').join("")).join("")+'</div><div class="bar" style="margin-top:16px"><button data-action="clear">Clear pattern</button><small>Click steps to edit the mock pattern. No audio.</small></div>')+'<div class="wide">'+card("Pattern controls",'<div class="sliders">'+slider("Swing",18)+slider("Gate",72)+'</div>')+'</div>',
builder:()=>title("Instrument Builder","Compose a custom instrument from inputs, transformations and destinations.",'<button class="primary" data-action="save">Save demo patch</button>')+card("Signal graph",'<div class="routegrid"><div class="node"><h3>01 · Input</h3><p>Trackpad touch</p>'+select("Input",["Trackpad touch","Magic Mouse","Gamepad axis","Remote motion","Camera hand"])+'</div><div class="node"><h3>02 · Transform</h3><p>Scale / dead zone / mapping</p>'+select("Transform",["Scale quantize","Linear CC","Threshold gate","Chord mapping"])+'</div><div class="node"><h3>03 · Output</h3><p>Expressive MIDI</p>'+select("Destination",["MPE note","MIDI CC11","MIDI CC64","GM drum note"])+'</div></div><p class="muted" style="margin-top:14px">Concept graph · no executable patch or automatic activation.</p>')+'<div class="wide layout"><div>'+card("Patch inspector",'<div class="fields">'+select("Root",["C","D","E","F","G","A","B"])+select("Scale",["C major","A minor","Chromatic"])+select("Trigger",["Hold","Toggle","Threshold"])+'</div><div class="sliders">'+slider("Dead zone",8)+slider("Smoothing",22)+'</div>')+'</div><div>'+card("Validation",'<div class="line">Graph <b>Illustrative</b></div><div class="line">Runtime <b>OFF</b></div><div class="notice">Real patches require validation, explicit arming and scoped release.</div>')+'</div></div>',
voice:()=>title("Voice","Text-to-speech and haptic voice playback concept.",'<button class="primary" data-action="start">Preview controls</button>')+'<div class="layout"><div>'+card("Text input",'<textarea aria-label="Voice text">Hello! Welcome to TIHULU Performance Studio.</textarea><div class="fields">'+select("Language",["English","Türkçe","Deutsch"])+select("Voice",["System default","Enhanced (example)"])+select("Output",["Trackpad haptic","Audio","Both"])+'</div>')+card("Voice waveform",wave())+'</div><div>'+card("Playback",'<div class="sliders">'+slider("Rate",50)+slider("Haptic intensity",35)+'</div>'+toggle("Push-to-talk","Shortcut recorder")+ '<div class="notice">No microphone, speech synthesis or haptic motor is accessed.</div>')+'</div></div>',
audio:()=>title("Audio & Speaker","Inspect a file or route system sound to the trackpad conceptually.",start())+'<div class="layout"><div>'+card("Audio file",'<div class="drop">↓<br><strong>Drop an audio file</strong><br><small>Visual placeholder — no file processing</small></div>'+wave()+'<div class="fields">'+select("Analysis mode",["Full mix","Melody","Rhythm","Voice"])+select("Source",["Audio file","System audio"])+select("Route",["Trackpad haptic","Both"])+'</div>')+'</div><div>'+card("Haptic speaker",'<div class="sliders">'+slider("Intensity",30)+slider("Clarity",60)+'</div>'+toggle("System audio capture","ScreenCaptureKit (native only)")+'<div class="notice">Not a virtual audio output driver. No capture in this preview.</div>')+'</div></div>',
remote:()=>title("Party Jam / Remote","Pair controllers and customize an adaptive performance workspace.",'<button class="primary" data-action="pair">Preview pairing</button>')+'<div class="layout"><div>'+card("Controller workspace",'<div class="tilegrid">'+device("Mac · Host","Local slot · trackpad & mouse","LOCAL")+device("Phone · Example","Touch keys / motion","NOT PAIRED")+device("Tablet · Example","Chord pads / faders","NOT PAIRED")+device("Controller · Example","Pedals / X-Y axes","NOT PAIRED")+'</div>')+card("Adaptive layout",'<div class="padgrid">'+["Cmaj","Dm","Em","Fmaj","Gmaj","Am","Sustain","Release"].map(n=>'<button class="pad" data-note="'+n+'">'+n+'</button>').join("")+'</div>')+'</div><div>'+card("Pairing",'<div class="drop" id="pairbox">Pairing QR placeholder<br>No actual code or address</div><div class="line">Mapping consent <b>Off</b></div><div class="line">Actual output <b>Off</b></div><div class="line">Remote devices <b>0 / 4</b></div><div class="notice">No live remapping. Reservations belong to peers; releasing an instrument does not free a reservation.</div><button class="danger" data-action="disconnect" style="margin-top:12px">Disconnect (demo)</button>')+'</div></div>',
gamepad:()=>title("Gamepad & Pedals","Map Xbox buttons, triggers and analog X/Y axes.",start())+'<div class="layout"><div>'+card("Controller mapping",'<svg viewBox="0 0 460 220" width="100%" role="img" aria-label="Illustrative game controller"><path d="M105 38 Q65 35 43 90 L19 155 Q9 195 48 199 Q67 200 91 164 L125 135 H335 L370 164 Q392 201 412 199 Q450 196 440 155 L416 90 Q394 35 355 38 Z" fill="#2a3039" stroke="#58626e" stroke-width="3"/><g fill="#14191d" stroke="#87928f" stroke-width="2"><circle cx="122" cy="85" r="32"/><circle cx="300" cy="132" r="32"/><path d="M184 113h15v-15h15v15h15v15h-15v15h-15v-15h-15Z"/><circle cx="359" cy="61" r="15"/><circle cx="384" cy="86" r="15"/><circle cx="359" cy="111" r="15"/><circle cx="334" cy="86" r="15"/></g><g fill="#a9e7c5" font-size="12" text-anchor="middle"><text x="122" y="89">L X/Y</text><text x="300" y="136">R X/Y</text><text x="359" y="65">Y</text><text x="384" y="90">B</text><text x="359" y="115">A</text><text x="334" y="90">X</text></g></svg><div class="fields">'+select("Left X",["Pitch bend","Expression","Modulation"])+select("Left Y",["Expression","Pitch bend","Volume"])+select("Right X",["Modulation","Pitch bend","Expression"])+select("Right Y",["Volume","Expression","Modulation"])+select("A button",["Sustain · hold","Sustain · toggle","Drive · toggle"])+select("B button",["Drive · toggle","Sustain · hold","Drive · hold"])+'</div>')+'</div><div>'+card("Pedals",toggle("Sustain pedal","CC64 · hold")+toggle("Drive pedal","Toggle")+toggle("Left trigger","Continuous CC")+toggle("Right trigger","Continuous CC"))+card("Calibration",'<div class="sliders">'+slider("Dead zone",12)+slider("Response curve",48)+'</div><small>Disconnected · simulated mapping only</small>')+'</div></div>',
settings:()=>title("Settings","Customize your workspace without changing real system permissions.")+'<div class="layout"><div>'+card("Appearance & language",'<div class="line"><div>Theme<small style="display:block">Dark / light preview</small></div><button data-action="theme">'+(theme?"Light":"Dark")+'</button></div>'+select("Language (concept)",["English","Türkçe","Deutsch"])+toggle("Compact workspace")+toggle("High contrast labels"))+card("Performance defaults",route()+toggle("Start inactive","Always off in this demo")+toggle("Pinned pedal controls"))+'</div><div>'+card("Global capture",'<div class="line">Shortcut <b>⌃ ⌥ Space</b></div><button data-action="shortcut">Record shortcut (demo)</button><div class="line">Emergency stop <b>Esc</b></div><div class="notice">macOS permissions are handled only in the native app.</div>')+'</div></div>',
diag:()=>title("Diagnostics","Inspect illustrative states without starting any device.",'<button data-action="refresh">Refresh snapshot</button>')+'<div class="layout"><div>'+card("Session snapshot",["Accessibility","Input monitoring","Event tap","CoreMIDI client","Force Touch","Remote transport","Native scheduler"].map(n=>'<div class="line"><span>'+n+'</span><small>Not accessed</small></div>').join(""))+card("Preview event log",'<div class="log" id="log"></div>')+'</div><div>'+card("Safety & acceptance",'<div class="notice">UI mock only. Native CI, timing, ownership and hardware acceptance are outside this preview. No readiness claim.</div><div class="line">Actual output <b>OFF</b></div><div class="line">Hardware tests <b>Not run</b></div>')+'</div></div>'
};
function wave(){return '<div class="wave" aria-label="Illustrative waveform">'+Array.from({length:90},(_,i)=>'<i style="height:'+Math.round(12+76*Math.abs(Math.sin(i*1.74)*Math.cos(i*.19)))+'%"></i>').join("")+'</div>'}
function render(){nav.innerHTML=sections.map(s=>'<div class="section">'+s[0]+'</div>'+s.slice(1).map(x=>'<button class="nav" data-page="'+x[0]+'" aria-current="'+(page===x[0])+'"><span aria-hidden="true">'+x[1]+'</span>'+x[2]+'</button>').join("")).join("")+'<div class="bottom"><small>DESIGN STUDY · 2026<br>Native macOS concept</small></div>';main.innerHTML=screens[page]();if($("#log"))$("#log").textContent=events.join("\n")||"No preview interactions yet.";$("#capture").textContent=capture?"Capture on (demo)":"Capture off";$("#capture").classList.toggle("active",capture);}
function stop(message){playing=false;capture=false;groupArmed=false;toggles={};log(message);render()}
nav.addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b){page=b.dataset.page;render()}});
main.addEventListener("change",e=>{if(e.target.dataset.choice){choices[e.target.dataset.choice]=e.target.value;log(e.target.dataset.choice+" → "+e.target.value+" (demo)")}});main.addEventListener("input",e=>{if(e.target.hasAttribute("data-slider"))e.target.parentElement.querySelector("output").textContent=e.target.value+"%"});
main.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;let d=b.dataset;if(d.toggle){toggles[d.toggle]=!toggles[d.toggle];b.classList.toggle("active",toggles[d.toggle]);b.textContent=toggles[d.toggle]?"On":"Off";b.setAttribute("aria-pressed",!!toggles[d.toggle]);log(d.toggle+" → "+b.textContent+" (demo)")}else if(d.step!==undefined){let k=Number(d.step);stepState.has(k)?stepState.delete(k):stepState.add(k);b.classList.toggle("on",stepState.has(k));b.setAttribute("aria-pressed",stepState.has(k))}else if(d.note){b.classList.add("hit");log(d.note+" · visual audition only");if($("#noteCount"))$("#noteCount").textContent="1 (demo)";setTimeout(()=>{b.classList.remove("hit");if($("#noteCount"))$("#noteCount").textContent="0"},220)}else if(d.action){switch(d.action){case"start":playing=!playing;log(playing?"Preview active · real output off":"Preview stopped");render();break;case"arm":groupArmed=!groupArmed;log("Group request simulated · no acknowledgement");render();break;case"clear":stepState.clear();render();break;case"theme":theme=!theme;$("#app").classList.toggle("light",theme);render();break;case"pair":$("#pairbox").textContent="Pairing simulated · no QR issued";log("Pairing preview only");break;case"disconnect":stop("Demo disconnected · all controls released");break;case"refresh":log("Snapshot refreshed · no hardware accessed");render();break;case"save":log("Demo patch selection retained for this session");break;case"shortcut":log("Shortcut recorder illustration only · no keys captured");break;}}});
$("#capture").onclick=()=>{capture=!capture;log(capture?"Capture simulated · cursor unaffected":"Capture off");render()};$("#release").onclick=()=>stop("All simulated controls released");$("#panic").onclick=()=>stop("PANIC · all simulated controls released");document.addEventListener("keydown",e=>{if(e.key==="Escape")stop("ESC · all simulated controls released")});render();
</script></body></html>
