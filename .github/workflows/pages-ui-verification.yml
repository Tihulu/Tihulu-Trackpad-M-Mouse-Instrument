name: Pages UI browser verification
on:
  push:
    branches: [gh-pages]
    paths:
      - docs/index.html
      - tools/verify-pages-ui.py
      - .github/workflows/pages-ui-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      UI_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test driver
        run: python -m pip install playwright==1.51.0
      - name: Install Chromium if runner Chrome is absent
        if: matrix.browser == 'chromium'
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Install WebKit engine
        if: matrix.browser == 'webkit'
        run: python -m playwright install --with-deps webkit
      - name: Verify offline UI
        run: python tools/verify-pages-ui.py
