name: TIHULU Trackpad Instrument CI

on:
  push:
    branches: [main]
    paths:
      - 'install-studio.sh'
      - 'studio/**'
      - 'tools/**'
      - 'examples/**'
      - 'AGENTS.md'
      - 'docs/DEVELOPER_SDK_AI_INDEX.md'
      - 'docs/ENGINE_CAPABILITIES.json'
      - '.github/workflows/nospeaker-studio.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'install-studio.sh'
      - 'studio/**'
      - 'tools/**'
      - 'examples/**'
      - 'AGENTS.md'
      - 'docs/DEVELOPER_SDK_AI_INDEX.md'
      - 'docs/ENGINE_CAPABILITIES.json'
      - '.github/workflows/nospeaker-studio.yml'

permissions:
  contents: read

jobs:
  core-tests:
    name: Shared core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Remote browser lifecycle tests
        run: node --test scripts/test-remote-browser.cjs
      - name: Verify
        run: ./scripts/verify.sh

  macos-build:
    name: macOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Installer shell syntax
        run: |
          sh -n ../install-studio.sh
          sh -n scripts/build-app.sh
          sh -n scripts/verify-preview-dmg.sh
      - name: Unit tests
        run: swift test
      - name: Build Studio
        run: swift build
      - name: Verify standalone engine CLI and repository index
        run: |
          python3 ../tools/test_engine_cli.py "$(swift build --show-bin-path)/tihulu-mac-instrument-engine"
          python3 ../tools/test_repo_index.py
          swift run --package-path ../examples/EngineConsumer engine-consumer
      - name: Install SVG icon renderer
        run: brew install librsvg
      - name: Build app bundle in installer mode
        env:
          TIHULU_BUILD_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'stable' || 'preview' }}
        run: NOSPEAKER_STUDIO_SKIP_TESTS=1 NOSPEAKER_STUDIO_BUILD_SHA="$GITHUB_SHA" ./scripts/build-app.sh
      - name: Validate TIHULU app branding and icon
        run: |
          APP="dist/Tihulu Trackpad & M. Mouse Instrument.app"
          test -s "$APP/Contents/Resources/TihuluInstrument.icns"
          test -s "$APP/Contents/Resources/TihuluTrackpadMouseIcon.svg"
          plutil -lint "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Contents/Info.plist"
      - name: Upload unsigned development app
        uses: actions/upload-artifact@v4
        with:
          name: TIHULU-Trackpad-Instrument-macOS-development
          path: studio/dist/Tihulu Trackpad & M. Mouse Instrument.app
      - name: Package isolated preview DMG
        if: github.ref != 'refs/heads/main'
        env:
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          APP="dist/Tihulu Trackpad & M. Mouse Instrument.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | grep -Fx 'com.tihulu.trackpadmmouseinstrument.preview'
          /usr/libexec/PlistBuddy -c 'Print :TIHULUBuildChannel' "$APP/Contents/Info.plist" | grep -Fx 'preview'
          codesign --verify --deep --verbose=2 "$APP"
          mkdir -p dist/preview-dmg-staging
          ditto "$APP" "dist/preview-dmg-staging/Tihulu Trackpad & M. Mouse Instrument Preview.app"
          ln -s /Applications dist/preview-dmg-staging/Applications
          # DiskImages can transiently report Resource busy on hosted macOS.
          # Retry only that specific error, never publish a partial image.
          DMG="dist/Tihulu-0.3.0-preview.dmg"
          LOG="$(mktemp)"
          trap 'rm -f "$LOG"' EXIT
          for attempt in 1 2 3; do
            if hdiutil create -volname "TIHULU 0.3.0 Preview" -srcfolder dist/preview-dmg-staging -format UDZO -ov "$DMG" >"$LOG" 2>&1; then
              cat "$LOG"
              break
            fi
            cat "$LOG" >&2
            rm -f "$DMG"
            if [ "$attempt" -eq 3 ] || ! grep -Fq 'Resource busy' "$LOG"; then
              exit 1
            fi
            sleep "$((attempt * 3))"
          done
          test -s "$DMG"
          hdiutil verify "$DMG"
          cd dist
          shasum -a 256 Tihulu-0.3.0-preview.dmg > PREVIEW-SHA256SUMS
          cd ..
          ./scripts/verify-preview-dmg.sh dist/Tihulu-0.3.0-preview.dmg dist/PREVIEW-SHA256SUMS "$GITHUB_SHA"
          printf 'checkout_sha=%s\nhead_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$PREVIEW_HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > dist/PREVIEW-PROVENANCE.txt
      - name: Upload preview DMG without publishing a release
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: TIHULU-0.3.0-preview-DMG
          path: |
            studio/dist/Tihulu-0.3.0-preview.dmg
            studio/dist/PREVIEW-SHA256SUMS
            studio/dist/PREVIEW-PROVENANCE.txt
          if-no-files-found: error
