name: TIHULU Trackpad Instrument CI

on:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'play.sh'
      - 'install-studio.sh'
      - 'uninstall-studio.sh'
      - 'studio/**'
      - 'tools/**'
      - 'examples/**'
      - 'AGENTS.md'
      - 'docs/DEVELOPER_SDK_AI_INDEX.md'
      - 'docs/ENGINE_CAPABILITIES.json'
      - 'docs/NATIVE_MIDI_ACCEPTANCE.md'
      - 'docs/INTEGRATION_CANDIDATE.md'
      - '.github/workflows/nospeaker-studio.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'build.sh'
      - 'play.sh'
      - 'install-studio.sh'
      - 'uninstall-studio.sh'
      - 'studio/**'
      - 'tools/**'
      - 'examples/**'
      - 'AGENTS.md'
      - 'docs/DEVELOPER_SDK_AI_INDEX.md'
      - 'docs/ENGINE_CAPABILITIES.json'
      - 'docs/NATIVE_MIDI_ACCEPTANCE.md'
      - 'docs/INTEGRATION_CANDIDATE.md'
      - '.github/workflows/nospeaker-studio.yml'

permissions:
  contents: read

jobs:
  core-tests:
    name: Shared core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.head_ref == 'qa/app-sdk-integration-20261125' || startsWith(github.head_ref, 'qa/music-')) && github.event.pull_request.head.sha || github.sha }}
      - name: Record and verify checkout provenance
        id: provenance
        env:
          EXPECTED_SHA: ${{ (github.head_ref == 'qa/app-sdk-integration-20261125' || startsWith(github.head_ref, 'qa/music-')) && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "TIHULU_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
          echo "Verified checkout: $actual; tree: $(git rev-parse HEAD^{tree})"
      - name: Swift version
        run: swift --version
      - name: Verify entrypoint modes and regressions
        run: |
          python3 ../tools/check_entrypoint_modes.py
          python3 ../tools/test_entrypoint_modes.py
      - name: Remote browser lifecycle tests
        run: node --test scripts/test-remote-browser.cjs
      - name: Verify native fixture inventory
        run: python3 ../tools/test_native_fixture_inventory.py
      - name: Verify
        run: ./scripts/verify.sh

  macos-build:
    name: macOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.head_ref == 'qa/app-sdk-integration-20261125' || startsWith(github.head_ref, 'qa/music-')) && github.event.pull_request.head.sha || github.sha }}
      - name: Record and verify checkout provenance
        id: provenance
        env:
          EXPECTED_SHA: ${{ (github.head_ref == 'qa/app-sdk-integration-20261125' || startsWith(github.head_ref, 'qa/music-')) && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "TIHULU_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
          echo "Verified checkout: $actual; tree: $(git rev-parse HEAD^{tree})"
      - name: Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Installer shell syntax and tracked entrypoint modes
        run: |
          python3 ../tools/check_entrypoint_modes.py
          sh -n ../install-studio.sh
          sh -n scripts/build-app.sh
          sh -n scripts/verify-preview-dmg.sh
      - name: Unit tests
        run: swift test
      - name: Isolated native MIDI observer and playback fixtures
        env:
          TIHULU_NATIVE_OBSERVER_FIXTURE: "1"
        run: |
          # A separate client keeps the on-demand MIDI server alive during
          # the gaps between isolated test processes. No ports/endpoints,
          # messages, daemon restart or retries. Preserve every failure.
          scratch="$(mktemp -d)"
          keeper=""
          cleanup() {
            if [ -n "$keeper" ]; then
              kill "$keeper" 2>/dev/null || true
              wait "$keeper" 2>/dev/null || true
            fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          swiftc ../tools/fixtures/native_midi_ci_keepalive.swift -o "$scratch/keeper"
          "$scratch/keeper" >"$scratch/keeper.log" 2>&1 &
          keeper=$!
          for attempt in {1..100}; do
            if ! kill -0 "$keeper" 2>/dev/null; then break; fi
            if grep -Fxq "CoreMIDI CI keepalive ready" "$scratch/keeper.log"; then break; fi
            sleep 0.1
          done
          cat "$scratch/keeper.log"
          if ! kill -0 "$keeper" 2>/dev/null || ! grep -Fxq "CoreMIDI CI keepalive ready" "$scratch/keeper.log"; then
            echo "CoreMIDI keepalive did not start; native acceptance failed."
            exit 1
          fi
          # Keep each fixture in a separate process. Collect every result
          # even if an early timing test fails; the step still fails.
          status=0
          for fixture in \
            nativeObserverReceivesIsolatedFixtureAndClosesItsPort \
            nativeObserverRefusesSuccessAfterIdentityLoss \
            nativeObserverSharedClientSurvivesIndependentPortCleanup \
            nativePlaybackUsesIsolatedSourceAndClosesIt \
            nativePlaybackStopBeforeRunEmitsNothing \
            nativePlaybackReceiverVerifiesNoteGateAndCancellation \
            nativePlaybackRejectsChangedAndRestoredSourceIdentity \
            nativePlaybackDetectsIdentityLossDuringInitialRest \
            nativePlaybackStopBeforeRunCannotMaskLostIdentity \
            nativePlaybackEmptyLedgerRetryStillChecksIdentity \
            nativePlaybackCloseRetiresTerminalStateAfterIdentityLoss \
            nativePlaybackRunAndCloseDisposesOnlyOwnSource \
            nativePlaybackRunAndClosePreservesIdentityRecoveryOnFailure \
            nativePlaybackPreparedSessionReceivesNoteGateBeforeDisposal \
            nativePlaybackOpenQuarantinesUnverifiedSourceWithoutDisposal \
            nativePlaybackSourceCapacityReleasesOnlyVerifiedClosedSlots \
            nativePlaybackCompoundSessionRetainsExclusiveFinalization \
            nativePlaybackCompoundCancellationBeforeDisposalDoesNotReportCompletion
          do
            log="$(mktemp)"
            if swift test --skip-build --filter "$fixture" >"$log" 2>&1; then
              # A missing filter or disabled fixture is not acceptance.
              if ! grep -F "Test $fixture() passed" "$log"; then
                echo "Fixture did not actually pass: $fixture"
                status=1
              fi
            else
              status=1
            fi
            cat "$log"
            rm -f "$log"
            if ! kill -0 "$keeper" 2>/dev/null; then
              echo "CoreMIDI keepalive exited during $fixture; native acceptance failed."
              status=1
            fi
          done
          # Additional bounded timing evidence on QA successors only.
          # These are mandatory trials, not retries: retain every failure.
          if [ "${GITHUB_HEAD_REF:-}" != "" ] && [[ "$GITHUB_HEAD_REF" == qa/music-* ]]; then
            for round in 1 2 3; do
              for timing_fixture in nativePlaybackReceiverVerifiesNoteGateAndCancellation nativePlaybackPreparedSessionReceivesNoteGateBeforeDisposal; do
                log="$(mktemp)"
                echo "Mandatory timing trial $round: $timing_fixture"
                if swift test --skip-build --filter "$timing_fixture" >"$log" 2>&1; then
                  if ! grep -F "Test $timing_fixture() passed" "$log"; then status=1; fi
                else
                  status=1
                fi
                cat "$log"
                rm -f "$log"
                if ! kill -0 "$keeper" 2>/dev/null; then status=1; fi
              done
            done
          fi
          exit "$status"
      - name: Build Studio
        run: swift build
      - name: Verify standalone engine CLI and repository index
        run: |
          python3 ../tools/test_engine_cli.py "$(swift build --show-bin-path)/tihulu-mac-instrument-engine"
          python3 ../tools/test_engine_catalog.py "$(swift build --show-bin-path)/tihulu-mac-instrument-engine"
          python3 ../tools/test_native_engine_cli.py "$(swift build --show-bin-path)/tihulu-mac-instrument-native"
          python3 ../tools/test_repo_index.py
          swift run --package-path ../examples/EngineConsumer engine-consumer
      - name: Compile experimental group MPE and remote gates (no execution or packaging)
        # Compile-only evidence remains useful even when a native fixture
        # failed. The job still fails and packaging/upload stay success-gated.
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' && github.event_name == 'pull_request' && (github.head_ref == 'feature/group-gamepad-adapter' || (github.head_ref == 'qa/app-sdk-integration-20261125' || startsWith(github.head_ref, 'qa/music-'))) }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/group-mpe-build.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          swift build --scratch-path "$scratch" --product NoSpeakerStudio -Xswiftc -DTIHULU_GROUP_MPE_LIVE -Xswiftc -DTIHULU_GROUP_REMOTE_LIVE -Xswiftc -DTIHULU_GROUP_HAPTIC_LIVE -Xswiftc -DTIHULU_GROUP_MPE_HAPTIC_LIVE -Xswiftc -DTIHULU_GROUP_DYNAMIC_MPE_LIVE -Xswiftc -DTIHULU_GROUP_DYNAMIC_MPE_HAPTIC_LIVE
      - name: Install SVG icon renderer
        run: brew install librsvg
      - name: Build app bundle in installer mode
        env:
          TIHULU_BUILD_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'stable' || 'preview' }}
        run: NOSPEAKER_STUDIO_SKIP_TESTS=1 NOSPEAKER_STUDIO_BUILD_SHA="$TIHULU_CHECKOUT_SHA" ./scripts/build-app.sh
      - name: Validate TIHULU app branding and icon
        run: |
          APP="dist/Tihulu Trackpad & M. Mouse Instrument.app"
          test -s "$APP/Contents/Resources/TihuluInstrument.icns"
          test -s "$APP/Contents/Resources/TihuluTrackpadMouseIcon.svg"
          plutil -lint "$APP/Contents/Info.plist"
          python3 ../tools/test_app_engine_boundary.py --bundle "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Contents/Info.plist"
      - name: Upload unsigned development app
        uses: actions/upload-artifact@v4
        with:
          name: TIHULU-Trackpad-Instrument-macOS-development
          path: studio/dist/Tihulu Trackpad & M. Mouse Instrument.app
      - name: Package isolated preview DMG
        if: github.ref != 'refs/heads/main'
        env:
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          APP="dist/Tihulu Trackpad & M. Mouse Instrument.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | grep -Fx 'com.tihulu.trackpadmmouseinstrument.preview'
          /usr/libexec/PlistBuddy -c 'Print :TIHULUBuildChannel' "$APP/Contents/Info.plist" | grep -Fx 'preview'
          codesign --verify --deep --verbose=2 "$APP"
          mkdir -p dist/preview-dmg-staging
          ditto "$APP" "dist/preview-dmg-staging/Tihulu Trackpad & M. Mouse Instrument Preview.app"
          ln -s /Applications dist/preview-dmg-staging/Applications
          # Only explicitly recognized transient DiskImages errors may retry.
          # Verification and read-only mounted inspection remain mandatory.
          . ./scripts/diskimage-retry.sh
          DMG="dist/Tihulu-0.3.0-preview.dmg"
          preview_create() {
            rm -f "$DMG" || return 1
            hdiutil create -volname "TIHULU 0.3.0 Preview" -srcfolder dist/preview-dmg-staging -format UDZO -ov "$DMG"
          }
          diskimage_retry preview_create || { rm -f "$DMG"; exit 1; }
          test -s "$DMG"
          cd dist
          shasum -a 256 Tihulu-0.3.0-preview.dmg > PREVIEW-SHA256SUMS
          cd ..
          ./scripts/verify-preview-dmg.sh dist/Tihulu-0.3.0-preview.dmg dist/PREVIEW-SHA256SUMS "$TIHULU_CHECKOUT_SHA"
          printf 'checkout_sha=%s\ncheckout_tree=%s\nhead_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$TIHULU_CHECKOUT_SHA" "$(git rev-parse HEAD^{tree})" "$PREVIEW_HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > dist/PREVIEW-PROVENANCE.txt
      - name: Upload preview DMG without publishing a release
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: TIHULU-0.3.0-preview-DMG
          path: |
            studio/dist/Tihulu-0.3.0-preview.dmg
            studio/dist/PREVIEW-SHA256SUMS
            studio/dist/PREVIEW-PROVENANCE.txt
          if-no-files-found: error


  ios-sensor-compile:
    name: iOS mobile sensor compile (experimental)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/music-')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          xcodebuild -version
      - name: Compile isolated iOS sensor library
        run: |
          set -euo pipefail
          xcodebuild -scheme NoSpeakerMobileCapture -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/tihulu-mobile-air" CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iOS diagnostic companion
        run: |
          set -euo pipefail
          xcodebuild -project mobile-ios/TihuluAirPreview.xcodeproj -scheme TihuluAirPreview -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/tihulu-ios-preview" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/tihulu-ios-preview/Build/Products/Debug-iphoneos/TihuluAirPreview.app"
          test -x "$APP/TihuluAirPreview"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/tihulu-ios-artifact"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/tihulu-ios-artifact/TihuluAirPreview-unsigned.zip"
          printf 'checkout_sha=%s\ncheckout_tree=%s\nrun_id=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/tihulu-ios-artifact/PROVENANCE.txt"
          cd "$RUNNER_TEMP/tihulu-ios-artifact"
          shasum -a 256 TihuluAirPreview-unsigned.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: TIHULU-iOS-unsigned-diagnostic-app
          path: ${{ runner.temp }}/tihulu-ios-artifact/
          if-no-files-found: error


  android-sensor-compile:
    name: Android mobile sensor compile and unit tests (experimental)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/music-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # Reuse Gradle downloads between runs of the same first-party PR.
          # GitHub scopes PR caches to the merge ref.
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Maven dependency retry policy
        run: python3 tools/test_android_gradle_ci.py
      - name: Resolve Android annotation dependencies (bounded Maven 429 retry)
        working-directory: studio/mobile-android
        run: python3 ../../tools/android_gradle_ci.py
      - name: Compile library and run local tests
        working-directory: studio/mobile-android
        run: gradle --no-daemon :assembleDebug :testDebugUnitTest :preview:assembleDebug :paired:assembleDebug
      - name: Record debug APK provenance
        working-directory: studio/mobile-android/preview/build/outputs/apk/debug
        run: |
          set -euo pipefail
          test -s preview-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions preview-debug.apk > APK-PERMISSIONS.txt
          if grep -F "android.permission.INTERNET" APK-PERMISSIONS.txt; then echo "Unexpected network permission"; exit 1; fi
          sha256sum preview-debug.apk > APK-SHA256SUMS
          printf "checkout_sha=%s\ncheckout_tree=%s\nrun_id=%s\n" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$GITHUB_RUN_ID" > APK-PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TIHULU-Android-RGB-diagnostic-debug-APK
          path: |
            studio/mobile-android/preview/build/outputs/apk/debug/preview-debug.apk
            studio/mobile-android/preview/build/outputs/apk/debug/APK-*.txt
            studio/mobile-android/preview/build/outputs/apk/debug/APK-SHA256SUMS
          if-no-files-found: error

      - name: Record separate paired debug APK provenance and permission boundary
        working-directory: studio/mobile-android/paired/build/outputs/apk/debug
        run: |
          set -euo pipefail
          test -s paired-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions paired-debug.apk > APK-PERMISSIONS.txt
          grep -F "android.permission.INTERNET" APK-PERMISSIONS.txt
          grep -F "android.permission.CAMERA" APK-PERMISSIONS.txt
          "$AAPT" dump badging paired-debug.apk > APK-BADGING.txt
          grep -F "package: name='com.tihulu.mobile.paired'" APK-BADGING.txt
          "$AAPT" dump xmltree paired-debug.apk AndroidManifest.xml > APK-MANIFEST.txt
          grep -F "com.tihulu.mobile.PAIRED_AIR" APK-MANIFEST.txt
          grep -E 'android:usesCleartextTraffic.*0x0$' APK-MANIFEST.txt
          grep -E 'android:allowBackup.*0x0$' APK-MANIFEST.txt
          sha256sum paired-debug.apk > APK-SHA256SUMS
          printf "checkout_sha=%s\ncheckout_tree=%s\nrun_id=%s\n" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$GITHUB_RUN_ID" > APK-PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TIHULU-Android-paired-experimental-debug-APK
          path: |
            studio/mobile-android/paired/build/outputs/apk/debug/paired-debug.apk
            studio/mobile-android/paired/build/outputs/apk/debug/APK-*.txt
            studio/mobile-android/paired/build/outputs/apk/debug/APK-SHA256SUMS
          if-no-files-found: error
