name: Publish TIHULU macOS DMG v0.2.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tihulu-release.yml'
      - 'studio/**'
      - 'install-studio.sh'
      - 'README.md'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tihulu-macos-release-v0.2.3
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    name: Build and publish macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect tools
        run: |
          xcodebuild -version
          swift --version
          sh -n install-studio.sh
          sh -n studio/scripts/build-app.sh

      - name: Install SVG icon renderer
        run: brew install librsvg

      - name: Run Swift regression tests
        working-directory: studio
        run: swift test

      - name: Build named TIHULU app with bundled vector icon
        working-directory: studio
        run: NOSPEAKER_STUDIO_SKIP_TESTS=1 NOSPEAKER_STUDIO_BUILD_SHA="$GITHUB_SHA" ./scripts/build-app.sh

      - name: Verify app identity and icon
        run: |
          APP="studio/dist/Tihulu Trackpad & M. Mouse Instrument.app"
          test -x "$APP/Contents/MacOS/NoSpeakerStudio"
          test -s "$APP/Contents/Resources/TihuluInstrument.icns"
          test -s "$APP/Contents/Resources/TihuluTrackpadMouseIcon.svg"
          plutil -lint "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Contents/Info.plist"
          codesign --verify --deep --verbose=2 "$APP"

      - name: Package drag-and-drop DMG
        run: |
          set -euo pipefail
          DMG="Tihulu-Trackpad-M-Mouse-Instrument-macOS.dmg"
          APP="studio/dist/Tihulu Trackpad & M. Mouse Instrument.app"
          mkdir -p studio/dist/dmg-staging
          ditto "$APP" "studio/dist/dmg-staging/$(basename "$APP")"
          ln -s /Applications "studio/dist/dmg-staging/Applications"
          hdiutil create -volname "TIHULU Trackpad Instrument" -srcfolder studio/dist/dmg-staging -ov -format UDZO "studio/dist/$DMG"
          cd studio/dist
          shasum -a 256 "$DMG" > SHA256SUMS
          test -s "$DMG"

      - name: Upload unsigned DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIHULU-Trackpad-Instrument-macOS-DMG
          path: |
            studio/dist/Tihulu-Trackpad-M-Mouse-Instrument-macOS.dmg
            studio/dist/SHA256SUMS

      - name: Publish GitHub Release v0.2.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.2.3 >/dev/null 2>&1; then
            echo "Release v0.2.3 already exists; leaving published assets untouched."
            exit 0
          fi
          gh release create v0.2.3 \
            studio/dist/Tihulu-Trackpad-M-Mouse-Instrument-macOS.dmg \
            studio/dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Tihulu Trackpad & M. Mouse Instrument v0.2.3" \
            --notes-file RELEASE_NOTES.md \
            --latest
